<style>
  :root{
    --paper:#F1EEE2;
    --card:#FFFFFF;
    --ink:#20241C;
    --ink-soft:#6A6F62;
    --ink-faint:#9A9C8F;
    --line:#DCD6C4;
    --shelf:#B8842E;
    --drawer:#2E6B6E;
    --box:#A6512E;
    --other:#6C6F63;

    --accent-ink:#FFFFFF;

    --success:#10B981;
    --radius:12px;
    --shadow:0 1px 2px rgba(32,36,28,.08), 0 4px 14px rgba(32,36,28,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;

    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:768px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-bottom:78px;
    box-shadow: 0 0 25px rgba(0,0,0,.05);
  }
  @media(min-width: 768px){
    #app{ max-width: 900px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  }
  .mono{font-family:'Space Mono',monospace;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    padding:18px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header.top h1{
    margin:0; font-size:20px; letter-spacing:.01em;
    font-family:'Space Mono',monospace; font-weight:700;
  }
  .version-tag{
    font-size:10px; font-weight:700; color:var(--ink);
    vertical-align:baseline; letter-spacing:0; cursor:pointer;
  }
  header.top .count{
    font-size:11px; color:var(--ink-soft); font-family:'Space Mono',monospace;
  }
  .search-row{
    display:flex; gap:8px; margin-top:12px;
  }
  .search-box{
    flex:1; display:flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:8px 10px;
  }
  .search-box input{
    border:none; outline:none; flex:1; font-size:14px; background:transparent; color:var(--ink); font-family:'Inter',sans-serif;
  }
  select.filter-select{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:9px; padding:8px 8px; font-size:12px; font-family:'Inter',sans-serif; max-width:130px;
  }

  main{flex:1; padding:14px 16px 8px;}

  }
  .empty-state .glyph{font-size:34px; margin-bottom:10px;}
  .empty-state p{font-size:13px; line-height:1.6; margin:4px 0;}

  .item-card{
    display:flex; gap:12px; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px; margin-bottom:10px; box-shadow:var(--shadow); cursor:pointer;

  }
  .item-thumb{
    width:56px; height:56px; border-radius:8px; object-fit:contain; flex-shrink:0;

  .item-info{flex:1; min-width:0;}

  .item-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}

  .tag-badge{

  .loc-icon{font-size:20px; width:30px; text-align:center; flex-shrink:0;}

    position:fixed; bottom:0; left:50%; transform:translateX(-50%);

    border-top:1px solid var(--line); display:flex; z-index:25;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));

    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;

  nav.bottom button.active{color:var(--accent); font-weight:600;}

  .overlay{

    display:flex; align-items:flex-end; justify-content:center;

  @media(min-width: 768px){ .overlay{ align-items:center; } }

  .sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-header h2{font-family:'Space Mono',monospace; font-size:16px; margin:0;}
  .close-btn{background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; line-height:1; padding:4px;}

  .action-choice{display:flex; flex-direction:column; gap:10px;}
  .action-choice button{
    display:flex; align-items:center; gap:12px; padding:14px; border-radius:var(--radius);
    background:var(--card); border:1px solid var(--line); font-size:14px; font-weight:600; color:var(--ink);
    cursor:pointer; text-align:left;
  }
  .action-choice button .ic{font-size:20px;}

  label{display:block; font-size:12px; color:var(--ink-soft); margin:12px 0 5px; font-weight:600;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], select, textarea{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:9px;
    background:var(--card); color:var(--ink); font-size:14px; font-family:'Inter',sans-serif; outline:none;

  .photo-picker{display:flex; align-items:center; gap:12px;}

    width:76px; height:76px; border-radius:10px; object-fit:contain; border:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:26px;
  }
  .photo-btns{display:flex; flex-direction:column; gap:6px;}
  .btn-secondary{
    padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card);
    font-size:12.5px; color:var(--ink); cursor:pointer; text-align:center;
  }
  .btn-primary{
    width:100%; margin-top:20px; padding:13px; border-radius:10px; border:none;
    background:var(--accent); color:#fff; font-size:14.5px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-danger{
    width:100%; margin-top:10px; padding:11px; border-radius:10px; border:1px solid var(--danger);
    background:transparent; color:var(--danger); font-size:13px; font-weight:600; cursor:pointer;
  }
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}

  .detail-photo{
    width:100%; aspect-ratio:16/9; border-radius:14px; object-fit:contain; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:40px; color:var(--ink-faint); margin-bottom:14px;
  }
  .detail-title{font-size:19px; font-weight:700; margin:0 0 8px;}
  .detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .detail-row .k{color:var(--ink-soft);}
  .detail-row .v{font-weight:600; text-align:right; max-width:65%; word-break:break-all;}
  .note-block{font-size:13px; color:var(--ink); line-height:1.6; margin-top:10px; white-space:pre-wrap; background:var(--card); padding:10px; border-radius:8px; border:1px solid var(--line);}
  .tag-chip{display:inline-block; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:3px 10px; font-size:11px; margin:3px 4px 0 0; color:var(--ink-soft);}
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:80;
    background:var(--ink); color:#fff; padding:9px 16px; border-radius:20px; font-size:12.5px; box-shadow:var(--shadow);
  }
  .loading-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:6px; animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

  .auth-gate{
    position:fixed; inset:0; z-index:100; background:var(--paper);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card{ width:100%; max-width:340px; text-align:center; }
  .auth-icon{ font-size:44px; margin-bottom:14px; }
  .auth-card h1{ font-family:'Space Mono',monospace; font-size:21px; margin:0 0 10px; }
  .auth-card p{ font-size:13px; color:var(--ink-soft); line-height:1.6; margin:0; }
  .auth-status{ margin-top:14px; font-size:12px; color:var(--ink-faint); min-height:16px; }
  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    margin-top:22px; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .cloud-btn{ background:none; border:none; font-size:15px; color:var(--ink-soft); cursor:pointer; padding:4px 2px; }
</style>

</div>
<div id="overlayRoot"></div>

<script>
function getDynamicVersion(){
  const now = new Date();
  const yy = String(now.getFullYear()).slice(-2);
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const hh = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  return `r${yy}.${mm}${dd}.${hh}${min}${ss}`;
}

const APP_VERSION = getDynamicVersion();
const VERSION_LOG = [
  { v: APP_VERSION, note:'自動更新版本號，確保部署正確無誤' },
  { v:'r26.0828.111900', note:'加入防呆識別碼 HOMESTOCK-GITHUB-DEPLOY，確保部署專案正確無誤' },
  { v:'r26.0828.111130', note:'加入前端智慧去背與 Tesseract.js 規格銘板文字 OCR 辨識自動帶入功能' },
  { v:'r26.0828.152723', note:'Google Drive 雲端同步' },
];

const STORE_KEYS = { LOCATIONS:'locations', ITEMS_INDEX:'items-index', ITEM_PREFIX:'item:' };
const GOOGLE_CLIENT_ID = '412152569230-fpq2tbie8v12ki3rb2nuhno0tq46cjl6.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_NAME = 'HomeStock 家庫資料';

let driveState = { accessToken:null, tokenClient:null, folderId:null };

function waitForGoogle(){
  return new Promise(resolve=>{
    (function tryInit(){
      if(window.google && google.accounts && google.accounts.oauth2) resolve();
      else setTimeout(tryInit, 100);
    })();
  });
}

async function initTokenClient(){
  await waitForGoogle();
  driveState.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: ()=>{},
  });
}

function requestAccessToken(interactive){
  return new Promise((resolve, reject)=>{
    driveState.tokenClient.callback = (resp)=>{
      if(resp.error){ reject(resp); return; }
      driveState.accessToken = resp.access_token;
      resolve(resp.access_token);
    };
    driveState.tokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
  });
}

async function driveFetch(url, options={}, allowRetry=true){
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer '+driveState.accessToken });
  const res = await fetch(url, options);
  if(res.status===401 && allowRetry){
    await requestAccessToken(false);
    return driveFetch(url, options, false);
  }
  return res;
}

async function ensureFolder(){
  if(driveState.folderId) return driveState.folderId;
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  if(data.files && data.files.length>0){ driveState.folderId = data.files[0].id; return driveState.folderId; }
  const createRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder' }),
  });
  const created = await createRes.json();
  driveState.folderId = created.id;
  return driveState.folderId;
}

async function findFileId(name){
  const folderId = await ensureFolder();
  const q = encodeURIComponent(`name='${name}' and '${folderId}' in parents and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function safeGet(key){
  try{
    const fileId = await findFileId(key+'.json');
    if(!fileId) return null;
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

async function safeSet(key, value){
  try{
    const folderId = await ensureFolder();
    const name = key+'.json';
    const existingId = await findFileId(name);
    const content = JSON.stringify(value);
    if(existingId){
      const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`, {
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body: content,
      });
      return res.ok;
    } else {
      const boundary = 'homestock-'+Date.now();
      const metadata = { name, parents:[folderId] };
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n`+
        `--${boundary}--`;
      const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`, {
        method:'POST',
        headers:{'Content-Type': `multipart/related; boundary=${boundary}`},
        body,
      });
      return res.ok;
    }
  }catch(e){ return false; }
}

async function safeDelete(key){
  try{
    const fileId = await findFileId(key+'.json');
    if(!fileId) return;
    await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, { method:'DELETE' });
  }catch(e){}
}

async function getLocations(){ return (await safeGet(STORE_KEYS.LOCATIONS)) || []; }
async function saveLocations(list){ return safeSet(STORE_KEYS.LOCATIONS, list); }
async function getItemsIndex(){ return (await safeGet(STORE_KEYS.ITEMS_INDEX)) || []; }
async function saveItemsIndex(list){ return safeSet(STORE_KEYS.ITEMS_INDEX, list); }
async function getItem(id){ return safeGet(STORE_KEYS.ITEM_PREFIX+id); }
async function saveItemRecord(item){ return safeSet(STORE_KEYS.ITEM_PREFIX+item.id, item); }
async function deleteItemRecord(id){ return safeDelete(STORE_KEYS.ITEM_PREFIX+id); }

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

let state = {
  tab:'items',
  locations:[],
  itemsIndex:[],
  query:'',
  locationFilter:'',
  statusFilter:'',
  photoDraft:null,
};

const LOC_TYPES = {
  shelf:{label:'層架', icon:'📚', cls:'tag-shelf'},
  drawer:{label:'抽屜', icon:'🗃️', cls:'tag-drawer'},
  box:{label:'箱', icon:'📦', cls:'tag-box'},
  other:{label:'其他', icon:'🏷️', cls:'tag-other'},
};

function locationById(id){ return state.locations.find(l=>l.id===id); }
function locationPath(id){
  const parts=[]; let cur=locationById(id); let guard=0;
  while(cur && guard<8){ parts.unshift(cur.name); cur = cur.parentId? locationById(cur.parentId): null; guard++; }
  return parts.join(' › ');
}
function locationTypeOf(id){
  const l=locationById(id); return l? l.type : 'other';
}

function processImageWithBackgroundRemoval(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; }
        else if(h>=w && h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; }
        
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        
        let rSum = 0, gSum = 0, bSum = 0;
        const corners = [0, (w-1)*4, (w*h - w)*4, (w*h - 1)*4];
        corners.forEach(idx => {
          rSum += data[idx]; gSum += data[idx+1]; bSum += data[idx+2];
        });
        const bgR = rSum/4, bgG = gSum/4, bgB = bSum/4;
        
        if((bgR + bgG + bgB) / 3 > 180){
          for(let i=0; i<data.length; i+=4){
            const r = data[i], g = data[i+1], b = data[i+2];
            const diff = Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB);
            if(diff < 55){
              data[i+3] = 0;
            }
          }
          ctx.putImageData(imgData, 0, 0);
        }
        
        const full = canvas.toDataURL('image/png');
        
        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.width = 160; thumbCanvas.height = 160;
        const tCtx = thumbCanvas.getContext('2d');
        tCtx.drawImage(canvas, 0, 0, 160, 160);
        const thumb = thumbCanvas.toDataURL('image/png');
        
        resolve({full, thumb});
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function toast(msg){
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('overlayRoot').appendChild(el);
  setTimeout(()=>el.remove(),1800);
}

async function init(){
  await initTokenClient();
  document.getElementById('authSigninBtn').addEventListener('click', doSignIn);
  document.getElementById('cloudBtn').addEventListener('click', openAccountSheet);
}

async function doSignIn(){
  const statusEl = document.getElementById('authStatus');
  statusEl.innerHTML = '<span class="loading-dot"></span>連線中…';
  try{
    await requestAccessToken(true);
    statusEl.textContent = '準備資料夾…';
    await ensureFolder();
    await afterSignIn();
  }catch(e){
    statusEl.textContent = '登入失敗或取消，請再試一次';
  }
}

async function afterSignIn(){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const vTag = document.getElementById('versionTag');
  vTag.textContent = APP_VERSION;
  vTag.addEventListener('click', showVersionLog);
  renderMain();
  state.locations = await getLocations();
  state.itemsIndex = await getItemsIndex();
  renderSearchRow();
  renderMain();
}

async function exportJsonData(){
  const allData = { locations: state.locations, items: state.itemsIndex, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(allData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `homestock-backup-${Date.now()}.json`;
  a.click();
  toast('已匯出 JSON 備份');
}

async function exportCsvData(){
  let csv = '\uFEFF名稱,數量,狀態,使用地方,設備ID,登入資訊,分類,儲位,標籤,更新時間\n';
  state.itemsIndex.forEach(i=>{
    const locName = locationPath(i.locationId) || '未指定';
    const statusText = i.status === 'out' ? '使用中' : '在庫';
    csv += `"${i.name || ''}",${i.qty || 1},"${statusText}","${i.outPlace || ''}","${i.deviceId || ''}","${i.loginInfo || ''}","${i.category || ''}","${locName}","${i.tags || ''}","${new Date(i.updatedAt).toLocaleString()}"\n`;
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `homestock-inventory-${Date.now()}.csv`;
  a.click();
  toast('已匯出 CSV 表格');
}

function renderMain(){
  const main = document.getElementById('main');
  document.getElementById('headerCount').textContent = state.tab==='items'
    ? `${state.itemsIndex.length} 件物品`
    : state.tab==='locations' ? `${state.locations.length} 個儲位` : '統計概況';

  if(state.tab==='items'){ main.innerHTML = renderItemsList(); bindItemCardClicks(); }
  else if(state.tab==='locations'){ main.innerHTML = renderLocationsList(); bindLocationCardClicks(); }
  else { main.innerHTML = renderStatsView(); }
}

function renderItemsList(){
  let list = state.itemsIndex;
  if(state.locationFilter) list = list.filter(i=>i.locationId===state.locationFilter);
  if(state.statusFilter) list = list.filter(i=> (i.status||'in') === state.statusFilter);
  if(state.query.trim()){
    const q=state.query.trim().toLowerCase();
    list = list.filter(i => 
      (i.name||'').toLowerCase().includes(q) || 
      (i.tags||'').toLowerCase().includes(q) || 
      (i.category||'').toLowerCase().includes(q) ||
      (i.deviceId||'').toLowerCase().includes(q) ||
      (i.outPlace||'').toLowerCase().includes(q)
    );
  }
  if(list.length===0){
    return `<div class="empty-state"><div class="glyph">📦</div>
      <p>${state.itemsIndex.length===0 ? '還沒有任何物品' : '找不到符合的物品'}</p>
      <p>${state.itemsIndex.length===0 ? '點右下角「＋」開始建立第一筆庫存' : '換個關鍵字或篩選條件試試'}</p>
    </div>`;
  }
  list = [...list].sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
  return list.map(it=>{
    const t = locationTypeOf(it.locationId);
    const tinfo = LOC_TYPES[t] || LOC_TYPES.other;
    const thumb = it.thumb
      ? `<img class="item-thumb" src="${it.thumb}" style="background:transparent;">`
      : `<div class="item-thumb">${tinfo.icon}</div>`;
    const isOut = it.status === 'out';
    return `
    <div class="item-card" data-id="${it.id}">
      ${thumb}
      <div class="item-info">
        <p class="name">${escapeHtml(it.name)}</p>
        <div class="item-meta">
          <span class="qty-badge">×${it.qty ?? 1}</span>
          <span class="status-badge ${isOut?'status-out':'status-in'}">${isOut ? '🟠 使用中' : '🟢 在庫'}</span>
          ${it.locationId ? `<span class="tag-badge ${tinfo.cls}">${escapeHtml(locationPath(it.locationId)||'未分類')}</span>` : `<span class="tag-badge tag-other">未指定儲位</span>`}
        </div>
        ${isOut && it.outPlace ? `<div class="tags-line" style="color:var(--warn);">📍 正在：${escapeHtml(it.outPlace)}</div>` : ''}
        ${it.deviceId ? `<div class="tags-line">🆔 ID: ${escapeHtml(it.deviceId)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderLocationsList(){
  if(state.locations.length===0){
    return `<div class="empty-state"><div class="glyph">🏷️</div>
      <p>還沒有建立任何儲位</p>
      <p>先建立像「客廳層架」「工具箱」這樣的儲位，之後物品才有地方放</p>
    </div>`;
  }
  const groups = {shelf:[],drawer:[],box:[],other:[]};
  state.locations.forEach(l=> (groups[l.type]||groups.other).push(l));
  let html='';
  Object.keys(LOC_TYPES).forEach(typeKey=>{
    const arr = groups[typeKey];
    if(!arr || arr.length===0) return;
    html += `<div class="loc-group-title">${LOC_TYPES[typeKey].icon} ${LOC_TYPES[typeKey].label} · ${arr.length}</div>`;
    html += arr.map(l=>{
      const count = state.itemsIndex.filter(i=>i.locationId===l.id).length;
      const path = l.parentId ? locationPath(l.parentId) : '';
      return `
      <div class="loc-card" data-id="${l.id}">
        <div class="loc-icon">${LOC_TYPES[l.type]?.icon || '🏷️'}</div>
        <div class="loc-body">
          <p class="loc-name">${escapeHtml(l.name)}</p>
          ${path ? `<div class="loc-path">位於 ${escapeHtml(path)}</div>` : ''}
        </div>
        <div class="loc-count">${count} 件</div>
      </div>`;
    }).join('');
  });
  return html;
}

  const totalItems = state.itemsIndex.length;
  const totalQty = state.itemsIndex.reduce((sum, i)=> sum + (Number(i.qty) || 1), 0);
  const outCount = state.itemsIndex.filter(i=> i.status === 'out').length;
  const totalLocs = state.locations.length;
  
  return `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">物品種類</div>
        <div class="num">${totalItems}</div>
      </div>

      </div>

async function saveLocationFromForm(existing){
  const name = document.getElementById('locName').value.trim();
  if(!name){ toast('請輸入儲位名稱'); return; }
  
  const duplicate = state.locations.find(l => l.name === name && (!existing || l.id !== existing.id));
  if(duplicate){
    toast('儲位名稱已存在，請使用不同的名稱');
    return;
  }

  const type = document.getElementById('locType').value;
  const parentId = document.getElementById('locParent').value || null;
  const note = document.getElementById('locNote').value.trim();
  if(existing){
    Object.assign(existing, {name,type,parentId,note});
  } else {
    state.locations.push({ id:uid('loc'), name, type, parentId, note, createdAt:Date.now() });
  }
  const ok = await saveLocations(state.locations);
  if(!ok){ toast('儲存失敗'); return; }
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('儲位已儲存');
}

async function deleteLocationFlow(id){
  if(state.itemsIndex.some(i=>i.locationId===id) || state.locations.some(l=>l.parentId===id)){
    toast('此儲位內還有物品或子儲位，請先清空'); return;
  }
  if(!confirm('確定要刪除這個儲位嗎？')) return;
  state.locations = state.locations.filter(l=>l.id!==id);
  await saveLocations(state.locations);
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('儲位已刪除');
}

    <label>備註（支援 OCR 自動填入規格電力規範）</label>
    <textarea id="itNote" placeholder="任何補充說明、規格或電力使用規範…"></textarea>
    <button class="btn-primary" id="saveItemBtn">${existingIndexEntry?'儲存變更':'建立物品'}</button>
    ${existingIndexEntry?'<button class="btn-danger" id="delItemBtn">刪除此物品</button>':''}
  `);

  document.getElementById('photoInput').addEventListener('change', handlePhotoInputAndOcr);
  document.getElementById('clearPhotoBtn').addEventListener('click', ()=>{
    state.photoDraft = 'REMOVE';
    document.getElementById('photoPreview').innerHTML = '🖼️';
    document.getElementById('ocrStatus').textContent = '';
  });
  document.getElementById('scanBarcodeBtn').addEventListener('click', startBarcodeScanner);
  document.getElementById('saveItemBtn').addEventListener('click', ()=> saveItemFromForm(existingIndexEntry));

  if(existingIndexEntry){
    document.getElementById('delItemBtn').addEventListener('click', ()=> deleteItemFlow(existingIndexEntry.id));
    getItem(existingIndexEntry.id).then(full=>{
      if(!full) return;
      document.getElementById('itName').value = full.name||'';
      document.getElementById('itQty').value = full.qty ?? 1;
      document.getElementById('itCategory').value = full.category||'';
      document.getElementById('itLocation').value = full.locationId||'';
      document.getElementById('itStatus').value = full.status || 'in';
      document.getElementById('itOutPlace').value = full.outPlace || '';
      document.getElementById('itDeviceId').value = full.deviceId || '';
      document.getElementById('itLoginInfo').value = full.loginInfo || '';
      document.getElementById('itTags').value = full.tags||'';
      document.getElementById('itNote').value = full.note||'';
      if(full.photo){
        document.getElementById('photoPreview').innerHTML = `<img src="${full.photo}" style="width:100%;height:100%;object-fit:contain;">`;
      }
    });
  }
}

async function handlePhotoInputAndOcr(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById('photoPreview');
  const ocrStatus = document.getElementById('ocrStatus');
  preview.innerHTML = `<span class="loading-dot"></span>`;
  ocrStatus.textContent = '🔄 正在進行智慧去背與 OCR 文字辨識（規格/電力規範）…';

  try {
    const processed = await processImageWithBackgroundRemoval(file, 900);
    state.photoDraft = processed;
    preview.innerHTML = `<img src="${processed.thumb}" style="width:100%;height:100%;object-fit:contain;">`;

    const worker = await Tesseract.createWorker('chi_tra+eng');
    const ret = await worker.recognize(file);
    await worker.terminate();

    const text = ret.data.text.trim();
    if(text){
      const currentNote = document.getElementById('itNote').value;
      document.getElementById('itNote').value = (currentNote ? currentNote + '\n\n' : '') + '【OCR 自動辨識規格/電力規範】：\n' + text;
      
      const snMatch = text.match(/(?:SN|S\/N|ID|No\.?)\s*[:：]?\s*([A-Za-z0-9\-]+)/i);
      if(snMatch && snMatch[1] && !document.getElementById('itDeviceId').value){
        document.getElementById('itDeviceId').value = snMatch[1];
      }

      ocrStatus.textContent = '✨ 去背完成，且已成功擷取銘板與電力規範文字！';
    } else {
      ocrStatus.textContent = '✨ 去背完成（未偵測到明顯文字銘板）';
    }
  } catch(err) {
    toast('圖片處理或 OCR 辨識失敗');
    preview.innerHTML = '🖼️';
    ocrStatus.textContent = '';
  }
}

let html5QrCode = null;
function startBarcodeScanner(){
  const container = document.getElementById('scannerContainer');
  container.style.display = 'block';
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (decodedText) => {
      document.getElementById('itName').value = `條碼: ${decodedText}`;
      stopBarcodeScanner();
      toast('成功讀取條碼！');
    },
    (errorMessage) => {}
  ).catch(err => {
    toast('無法啟動相機權限');
    container.style.display = 'none';
  });
  document.getElementById('closeScannerBtn').onclick = stopBarcodeScanner;
}

function stopBarcodeScanner(){
  if(html5QrCode){
    html5QrCode.stop().then(()=>{
      document.getElementById('scannerContainer').style.display = 'none';
    }).catch(err => {
      document.getElementById('scannerContainer').style.display = 'none';
    });
  } else {
    document.getElementById('scannerContainer').style.display = 'none';
  }
}

async function saveItemFromForm(existingIndexEntry){
  stopBarcodeScanner();
  const name = document.getElementById('itName').value.trim();
  if(!name){ toast('請輸入物品名稱'); return; }
  const qty = parseFloat(document.getElementById('itQty').value) || 0;
  const category = document.getElementById('itCategory').value.trim();
  const locationId = document.getElementById('itLocation').value;
  const status = document.getElementById('itStatus').value;
  const outPlace = document.getElementById('itOutPlace').value.trim();
  const deviceId = document.getElementById('itDeviceId').value.trim();
  const loginInfo = document.getElementById('itLoginInfo').value.trim();
  const tags = document.getElementById('itTags').value.trim();
  const note = document.getElementById('itNote').value.trim();
  const now = Date.now();

  let id, createdAt, photo, thumb;
  if(existingIndexEntry){
    id = existingIndexEntry.id;
    const prevFull = await getItem(id) || {};
    createdAt = prevFull.createdAt || now;
    photo = prevFull.photo; thumb = existingIndexEntry.thumb;
  } else {
    id = uid('item'); createdAt = now;
  }
  if(state.photoDraft === 'REMOVE'){ photo=undefined; thumb=undefined; }
  else if(state.photoDraft && state.photoDraft.full){ photo=state.photoDraft.full; thumb=state.photoDraft.thumb; }

  const fullRecord = { id, name, qty, category, locationId, status, outPlace, deviceId, loginInfo, tags, note, photo, createdAt, updatedAt: now };
  await saveItemRecord(fullRecord);

  const indexEntry = { id, name, qty, category, locationId, status, outPlace, deviceId, tags, thumb, updatedAt: now };
  const idx = state.itemsIndex.findIndex(i=>i.id===id);
  if(idx>=0) state.itemsIndex[idx]=indexEntry; else state.itemsIndex.push(indexEntry);
  await saveItemsIndex(state.itemsIndex);

  closeOverlay();
  renderSearchRow(); renderMain();
  toast(existingIndexEntry ? '物品已更新' : '物品已建立');
}

async function deleteItemFlow(id){
  if(!confirm('確定要刪除這個物品嗎？')) return;
  state.itemsIndex = state.itemsIndex.filter(i=>i.id!==id);
  await saveItemsIndex(state.itemsIndex);
  await deleteItemRecord(id);
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('物品已刪除');
}

async function openItemDetail(id){
  const indexEntry = state.itemsIndex.find(i=>i.id===id);
  if(!indexEntry) return;
  openOverlay(`<div class="sheet-header"><h2>物品詳情</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div><p class="hint"><span class="loading-dot"></span>載入中…</p>`);
  const full = await getItem(id);
  if(!full){ toast('讀取失敗'); closeOverlay(); return; }
  const t = locationTypeOf(full.locationId);
  const tinfo = LOC_TYPES[t]||LOC_TYPES.other;
  const isOut = full.status === 'out';
  
  document.querySelector('#overlayRoot .sheet').innerHTML = `
    <div class="sheet-header"><h2>物品詳情</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    ${full.photo ? `<img class="detail-photo" src="${full.photo}" style="background:transparent;">` : `<div class="detail-photo">${tinfo.icon}</div>`}
    <p class="detail-title">${escapeHtml(full.name)}</p>
    <div class="detail-row"><span class="k">狀態</span><span class="v"><span class="status-badge ${isOut?'status-out':'status-in'}">${isOut ? '🟠 使用中' : '🟢 在庫'}</span></span></div>
    ${isOut && full.outPlace ? `<div class="detail-row"><span class="k">使用地方</span><span class="v" style="color:var(--warn);">${escapeHtml(full.outPlace)}</span></div>` : ''}
    <div class="detail-row"><span class="k">數量</span><span class="v">${full.qty ?? 1}</span></div>
    ${full.deviceId ? `<div class="detail-row"><span class="k">設備 ID</span><span class="v mono">${escapeHtml(full.deviceId)}</span></div>` : ''}
    ${full.loginInfo ? `<div class="detail-row"><span class="k">登入資訊</span><span class="v mono">${escapeHtml(full.loginInfo)}</span></div>` : ''}
    ${full.category?`<div class="detail-row"><span class="k">分類</span><span class="v">${escapeHtml(full.category)}</span></div>`:''}
    <div class="detail-row"><span class="k">固定儲位</span><span class="v"><span class="tag-badge ${tinfo.cls}">${escapeHtml(locationPath(full.locationId)||'未指定')}</span></span></div>
    <div class="detail-row"><span class="k">更新時間</span><span class="v">${new Date(full.updatedAt).toLocaleString('zh-TW')}</span></div>
    ${full.tags ? `<div style="margin-top:10px;">${full.tags.split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    ${full.note ? `<div class="note-block"><b>備註與規格規範：</b><br>${escapeHtml(full.note)}</div>` : ''}
    <button class="btn-primary" id="editItemBtn">編輯物品 / 變更狀態</button>
  `;
  document.getElementById('editItemBtn').addEventListener('click', ()=> openItemForm(indexEntry));
}

document.querySelectorAll('nav.bottom button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    renderSearchRow();
    renderMain();
  });
});

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

init();
</script>
