<style>
  :root{
    --paper:#F1EEE2;
    --card:#FFFFFF;
    --ink:#20241C;
    --ink-soft:#6A6F62;
    --ink-faint:#9A9C8F;
    --line:#DCD6C4;
    --shelf:#B8842E;
    --storage:#A6512E;
    --location:#2E6B6E;
    --accent:#2E6B6E;
    --accent-ink:#FFFFFF;
    --danger:#B23A34;
    --radius:12px;
    --shadow:0 1px 2px rgba(32,36,28,.08), 0 4px 14px rgba(32,36,28,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100vh;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }
  
  #app{
    width:100%;
    max-width:480px;
    height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-bottom:78px;
  }

  @media (min-width: 768px) {
    #app {
      max-width: 1200px;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 380px 1fr;
      grid-template-rows: auto 1fr auto;
      padding-bottom: 0;
    }
    header.top { grid-column: 1 / 3; }
    nav.bottom {
      grid-column: 1 / 2; grid-row: 3 / 4;
      position: relative !important; bottom: auto !important; left: auto !important;
      width: 100% !important; max-width: 380px !important;
      border-top: 1px solid var(--line); border-right: 1px solid var(--line);
    }
    main { grid-column: 1 / 2; grid-row: 2 / 3; overflow-y: auto; }
    #desktopDetailPane {
      grid-column: 2 / 3; grid-row: 2 / 4;
      background: var(--card); border-left: 1px solid var(--line);
      padding: 24px; overflow-y: auto; display: block;
    }
  }

  #desktopDetailPane { display: none; }
  .mono{font-family:'Space Mono',monospace;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--paper); padding:18px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{ display:flex; align-items:baseline; justify-content:space-between; }
  header.top h1{
    margin:0; font-size:20px; letter-spacing:.01em;
    font-family:'Space Mono',monospace; font-weight:700;
  }
  .version-tag{
    font-size:10px; font-weight:700; color:var(--ink);
    vertical-align:baseline; letter-spacing:0; cursor:pointer;
  }
  .header-tools{ display:flex; align-items:center; gap:8px; }
  .lang-btn, .cloud-btn{
    background:none; border:1px solid var(--line); border-radius:6px;
    font-size:11px; font-weight:600; color:var(--ink-soft); cursor:pointer; padding:3px 6px;
  }
  .search-row{ display:flex; gap:8px; margin-top:12px; }
  .search-box{
    flex:1; display:flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 10px;
  }
  .search-box input{
    border:none; outline:none; flex:1; font-size:14px; background:transparent; color:var(--ink); font-family:'Inter',sans-serif;
  }
  select.filter-select{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:9px; padding:8px 8px; font-size:12px; font-family:'Inter',sans-serif; max-width:110px;
  }

  main{flex:1; padding:14px 16px 8px; overflow-y:auto;}
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state .glyph{ font-size:34px; margin-bottom:10px; }
  .empty-state p{ font-size:13px; line-height:1.6; margin:4px 0; }

  .item-card{
    display:flex; gap:12px; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px; margin-bottom:10px; box-shadow:var(--shadow); cursor:pointer;
  }
  .item-thumb{
    width:56px; height:56px; border-radius:8px; object-fit:cover; flex-shrink:0;
    background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--ink-faint);
  }
  .item-info{flex:1; min-width:0;}
  .item-info .name{font-size:14.5px; font-weight:600; margin:0 0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .qty-badge{font-size:11px; color:var(--ink-soft); font-family:'Space Mono',monospace;}

  .tag-badge{
    display:inline-flex; align-items:center;
    font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.01em;
    color:#fff; padding:3px 9px 3px 15px; line-height:1.5;
    clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%);
    position:relative; white-space:nowrap; max-width:180px; overflow:hidden; text-overflow:ellipsis;
  }
  .tag-badge::after{
    content:''; position:absolute; left:4px; top:50%; transform:translateY(-50%);
    width:3.5px; height:3.5px; border-radius:50%; background:rgba(255,255,255,.9);
  }
  .tag-location{background:var(--location);}
  .tag-shelf{background:var(--shelf);}
  .tag-storage{background:var(--storage);}
  .tags-line{font-size:11px; color:var(--ink-faint); margin-top:2px;}

  .loc-group-title{
    font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-soft);
    margin:18px 0 8px; text-transform:uppercase; letter-spacing:.06em;
  }
  .loc-group-title:first-child{margin-top:2px;}
  .loc-card{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; margin-bottom:9px; box-shadow:var(--shadow); cursor:pointer;
  }
  .loc-icon{font-size:20px; width:30px; text-align:center; flex-shrink:0;}
  .loc-body{flex:1; min-width:0;}
  .loc-name{font-size:14px; font-weight:600; margin:0;}
  .loc-path{font-size:11px; color:var(--ink-faint); margin-top:1px;}
  .loc-count{font-size:11px; color:var(--ink-soft); font-family:'Space Mono',monospace; flex-shrink:0;}

  .stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);}
  .stat-card .num{font-size:22px; font-weight:700; font-family:'Space Mono',monospace; color:var(--accent); margin-top:4px;}
  .stat-card .label{font-size:12px; color:var(--ink-soft);}

  .fab{
    position:fixed; right:24px; bottom:24px; z-index:30;
    width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff; border:none;
    font-size:26px; box-shadow:0 4px 14px rgba(46,107,110,.4);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  nav.bottom{
    position:absolute; bottom:0; left:0; width:100%; background:var(--card);
    border-top:1px solid var(--line); display:flex; z-index:25;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottom button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-faint); font-size:10.5px; font-family:'Inter',sans-serif; cursor:pointer; padding:4px;
  }
  nav.bottom button .ic{font-size:19px;}
  nav.bottom button.active{color:var(--accent); font-weight:600;}

  .overlay{
    position:fixed; inset:0; background:rgba(32,36,28,.42); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width: 768px) { .overlay { align-items: center; } }
  .sheet{
    background:var(--paper); width:100%; max-width:480px; border-radius:18px 18px 0 0;
    max-height:92vh; overflow-y:auto; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:slideup .18s ease-out;
  }
  @media (min-width: 768px) { .sheet { border-radius: 18px; max-width: 540px; } }
  @keyframes slideup{from{transform:translateY(24px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-header h2{font-family:'Space Mono',monospace; font-size:16px; margin:0;}
  .close-btn{background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; line-height:1; padding:4px;}

  .action-choice{display:flex; flex-direction:column; gap:10px;}
  .action-choice button{
    display:flex; align-items:center; gap:12px; padding:14px; border-radius:var(--radius);
    background:var(--card); border:1px solid var(--line); font-size:14px; font-weight:600; color:var(--ink);
    cursor:pointer; text-align:left;
  }
  .action-choice button .ic{font-size:20px;}

  label{display:block; font-size:12px; color:var(--ink-soft); margin:14px 0 6px; font-weight:600;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], select, textarea{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:9px;
    background:var(--card); color:var(--ink); font-size:14px; font-family:'Inter',sans-serif; outline:none;
  }
  textarea{resize:vertical; min-height:60px;}
  .hint{font-size:11px; color:var(--ink-faint); margin-top:5px;}

  .photo-manager{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px;}
  .photo-thumb-item{
    width:72px; height:72px; border-radius:10px; border:1px solid var(--line); background:var(--card);
    position:relative; flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
  }
  .photo-thumb-item img{width:100%; height:100%; object-fit:cover;}
  .photo-thumb-item .del-photo{
    position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.6); color:#fff; border:none;
    border-radius:50%; width:20px; height:20px; font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .add-photo-btn{
    width:72px; height:72px; border-radius:10px; border:2px dashed var(--line); background:var(--card);
    display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--ink-faint);
    font-size:12px; cursor:pointer; flex-shrink:0; gap:2px;
  }

  .btn-secondary{
    padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card);
    font-size:12.5px; color:var(--ink); cursor:pointer; text-align:center;
  }
  .btn-primary{
    width:100%; margin-top:20px; padding:13px; border-radius:10px; border:none;
    background:var(--accent); color:#fff; font-size:14.5px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-danger{
    width:100%; margin-top:10px; padding:11px; border-radius:10px; border:1px solid var(--danger);
    background:transparent; color:var(--danger); font-size:13px; font-weight:600; cursor:pointer;
  }
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}

  .detail-photo-slider{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px;}
  .detail-photo{
    width:100%; aspect-ratio:1/1; border-radius:14px; object-fit:cover; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:40px; color:var(--ink-faint); flex-shrink:0;
  }
  .detail-title{font-size:19px; font-weight:700; margin:0 0 8px;}
  .detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .detail-row .k{color:var(--ink-soft);}
  .detail-row .v{font-weight:600; text-align:right; max-width:65%;}
  .note-block{font-size:13px; color:var(--ink); line-height:1.6; margin-top:10px; white-space:pre-wrap;}
  .tag-chip{display:inline-block; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:3px 10px; font-size:11px; margin:3px 4px 0 0; color:var(--ink-soft);}
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:80;
    background:var(--ink); color:#fff; padding:9px 16px; border-radius:20px; font-size:12.5px; box-shadow:var(--shadow);
  }
  .loading-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:6px; animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

  .auth-gate{
    position:fixed; inset:0; z-index:100; background:var(--paper);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card{ width:100%; max-width:340px; text-align:center; }
  .auth-icon{ font-size:44px; margin-bottom:14px; }
  .auth-card h1{ font-family:'Space Mono',monospace; font-size:21px; margin:0; }
  .auth-card p{ font-size:13px; color:var(--ink-soft); line-height:1.6; margin:0; }
  .auth-status{ margin-top:14px; font-size:12px; color:var(--ink-faint); min-height:16px; word-break:break-all; }
  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    margin-top:22px; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
</style>

const STORE_KEYS = { LOCATIONS:'locations', ITEMS_INDEX:'items-index', ITEM_PREFIX:'item:' };
const GOOGLE_CLIENT_ID = '412152569230-fpq2tbie8v12ki3rb2nuhno0tq46cjl6.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_NAME = 'HomeStock 家庫資料';

let driveState = { accessToken:null, tokenClient:null, folderId:null };

function waitForGoogle(){
  return new Promise(resolve=>{
    let attempts = 0;
    (function tryInit(){
      if(window.google && window.google.accounts && window.google.accounts.oauth2) {
         resolve(true);
      } else if(attempts > 50) {
         resolve(false); 
      } else {
         attempts++;
         setTimeout(tryInit, 100);
      }
    })();
  });
}

async function initTokenClient(){
  const success = await waitForGoogle();
  if (success) {
      driveState.tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: ()=>{},
      });
  }
}

function requestAccessToken(interactive){
  return new Promise((resolve, reject)=>{
    if(!driveState.tokenClient){
      reject(new Error("Google Identity API 載入遭到瀏覽器攔截"));
      return;
    }
    driveState.tokenClient.callback = (resp)=>{
      if(resp.error){ reject(resp); return; }
      driveState.accessToken = resp.access_token;
      resolve(resp.access_token);
    };
    driveState.tokenClient.requestAccessToken({ prompt: interactive ? 'select_account' : '' });
  });
}

async function driveFetch(url, options={}, allowRetry=true){
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer '+driveState.accessToken });
  const res = await fetch(url, options);
  if(res.status===401 && allowRetry){
    await requestAccessToken(false);
    return driveFetch(url, options, false);
  }
  return res;
}

async function ensureFolder(){
  if(driveState.folderId) return driveState.folderId;
  const q = encodeURIComponent("name='" + DRIVE_FOLDER_NAME + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const res = await driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)');
  const data = await res.json();
  if(data.files && data.files.length>0){ driveState.folderId = data.files[0].id; return driveState.folderId; }
  const createRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder' }),
  });
  const created = await createRes.json();
  driveState.folderId = created.id;
  return driveState.folderId;
}

async function findFileId(name){
  const folderId = await ensureFolder();
  const q = encodeURIComponent("name='" + name + "' and '" + folderId + "' in parents and trashed=false");
  const res = await driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)');
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function safeGet(key){
  try{
    const fileId = await findFileId(key+'.json');
    if(!fileId) return null;
    const res = await driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

async function safeSet(key, value){
  try{
    const folderId = await ensureFolder();
    const name = key+'.json';
    const existingId = await findFileId(name);
    const content = JSON.stringify(value);
    if(existingId){
      const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + existingId + '?uploadType=media', {
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body: content,
      });
      return res.ok;
    } else {
      const boundary = 'homestock-'+Date.now();
      const metadata = { name, parents:[folderId] };
      const body =
        '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
        '--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + content + '\r\n' +
        '--' + boundary + '--';
      const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method:'POST',
        headers:{'Content-Type': 'multipart/related; boundary=' + boundary},
        body,
      });
      return res.ok;
    }
  }catch(e){ return false; }
}

async function safeDelete(key){
  try{
    const fileId = await findFileId(key+'.json');
    if(!fileId) return;
    await driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId, { method:'DELETE' });
  }catch(e){}
}

function containerById(id){ return state.locations.find(l=>l.id===id); }
function containerPath(id){
  const parts=[]; let cur=containerById(id); let guard=0;
  while(cur && guard<8){ parts.unshift(cur.name); cur = cur.parentId? containerById(cur.parentId): null; guard++; }
  return parts.join(' › ');
}
function containerTypeOf(id){
  const l=containerById(id); return l? l.type : 'location';
}

function compressImage(file, maxSize, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; }
        else if(h>=w && h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        
        const data = ctx.getImageData(0, 0, 32, 32).data;
        let hash = 0;
        for (let i = 0; i < data.length; i += 4) {
          hash = ((hash << 5) - hash) + (data[i] + data[i+1] + data[i+2]);
          hash |= 0;
        }

        resolve({full: canvas.toDataURL('image/jpeg', quality), thumb: canvas.toDataURL('image/jpeg', 0.6), hash: Math.abs(hash)});
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function renderItemsList(){
  let list = state.itemsIndex;
  if(state.locationFilter) list = list.filter(i=>i.locationId===state.locationFilter);
  if(state.query.trim()){
    const q=state.query.trim().toLowerCase();
    list = list.filter(i => (i.name||'').toLowerCase().includes(q) || (i.tags||'').toLowerCase().includes(q) || (i.category||'').toLowerCase().includes(q));
  }
  if(list.length===0){
    const msg1 = state.itemsIndex.length===0 ? t('noItemsFound') : t('noMatchingItems');
    const msg2 = state.itemsIndex.length===0 ? t('tapToAdd') : t('tryKeywords');
    return '<div class="empty-state"><div class="glyph">📦</div><p>' + msg1 + '</p><p>' + msg2 + '</p></div>';
  }
  list = [...list].sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
  
  return list.map(it=>{
    const t_type = containerTypeOf(it.locationId);
    const tinfo = CONTAINER_TYPES[t_type] || CONTAINER_TYPES.location;
    const thumb = it.thumb
      ? '<img class="item-thumb" src="' + it.thumb + '">'
      : '<div class="item-thumb">' + tinfo.icon + '</div>';
      
    const locBadge = it.locationId 
      ? '<span class="tag-badge '+tinfo.cls+'">' + escapeHtml(containerPath(it.locationId)||'Unclassified') + '</span>' 
      : '<span class="tag-badge tag-location">No Placement</span>';
      
    const tagsLine = it.tags ? '<div class="tags-line">' + escapeHtml(it.tags) + '</div>' : '';

    return '<div class="item-card" data-id="' + it.id + '">' +
        thumb +
        '<div class="item-info">' +
          '<p class="name">' + escapeHtml(it.name) + '</p>' +
          '<div class="item-meta">' +
            '<span class="qty-badge">×' + (it.qty ?? 1) + '</span>' +
            locBadge +
          '</div>' +
          tagsLine +
        '</div>' +
      '</div>';
  }).join('');
}

function renderLocationsList(){
  if(state.locations.length===0){
    return '<div class="empty-state"><div class="glyph">🏷️</div>' +
      '<p>' + t('noLocsFound') + '</p>' +
      '<p>' + t('createLocFirst') + '</p>' +
    '</div>';
  }
  const groups = {location:[],shelf:[],box:[],drawer:[],cabinet:[]};
  state.locations.forEach(l=> (groups[l.type]||groups.location).push(l));
  let html='';
  ['location','shelf','box','drawer','cabinet'].forEach(typeKey=>{
    const arr = groups[typeKey];
    if(!arr || arr.length===0) return;
    html += '<div class="loc-group-title">' + CONTAINER_TYPES[typeKey].icon + ' ' + CONTAINER_TYPES[typeKey].label + ' · ' + arr.length + '</div>';
    html += arr.map(l=>{
      const count = state.itemsIndex.filter(i=>i.locationId===l.id).length;
      const path = l.parentId ? containerPath(l.parentId) : '';
      const pathHtml = path ? '<div class="loc-path">In ' + escapeHtml(path) + '</div>' : '';
      
      return '<div class="loc-card" data-id="' + l.id + '">' +
          '<div class="loc-icon">' + (CONTAINER_TYPES[l.type]?.icon || '🏠') + '</div>' +
          '<div class="loc-body">' +
            '<p class="loc-name">' + escapeHtml(l.name) + '</p>' +
            pathHtml +
          '</div>' +
          '<div class="loc-count">' + count + ' items</div>' +
        '</div>';
    }).join('');
  });
  return html;
}

  const saveText = existing ? t('saveChanges') : t('create');
  const delBtnHtml = existing ? '<button class="btn-danger" id="delConBtn">' + t('deleteContainer') + '</button>' : '';

  const html = '<div class="sheet-header"><h2>' + titleText + '</h2><button class="close-btn" onclick="window.closeOverlay()">✕</button></div>' +
    '<label>Name</label>' +
    '<input type="text" id="conName" placeholder="' + t('containerNamePlaceholder') + '" value="' + (existing?escapeAttr(existing.name):'') + '">' +
    '<label>Type (Hierarchy)</label>' +
    '<select id="conType" onchange="window.updateParentOptionsForContainerType(this.value)">' +
      '<option value="location" ' + (currentType==='location'?'selected':'') + '>🏠 Location</option>' +
      '<option value="shelf" ' + (currentType==='shelf'?'selected':'') + '>📚 Shelf</option>' +
      '<option value="box" ' + (currentType==='box'?'selected':'') + '>📦 Box</option>' +
      '<option value="drawer" ' + (currentType==='drawer'?'selected':'') + '>🗄️ Drawer</option>' +
      '<option value="cabinet" ' + (currentType==='cabinet'?'selected':'') + '>🚪 Cabinet</option>' +
    '</select>' +
    '<div id="parentContainerWrapper" style="' + (currentType==='location'?'display:none;':'') + '">' +
      '<label>Parent Container</label>' +
      '<select id="conParent"></select>' +
    '</div>' +
    '<label>Notes (Optional)</label>' +
    '<textarea id="conNote" placeholder="' + t('notesPlaceholder') + '">' + (existing?escapeHtml(existing.note||''):'') + '</textarea>' +
    '<button class="btn-primary" id="saveConBtn">' + saveText + '</button>' +
    delBtnHtml;

  window.openOverlay(html);

  window.updateParentOptionsForContainerType = function(typeVal) {
    const wrapper = document.getElementById('parentContainerWrapper');
    const parentSel = document.getElementById('conParent');
    if(typeVal === 'location'){
      wrapper.style.display = 'none';
      parentSel.innerHTML = '<option value="">None</option>';
    } else {
      wrapper.style.display = 'block';
      let validParents = [];
      if(typeVal === 'shelf'){
        validParents = state.locations.filter(l => (!existing || l.id !== existing.id) && l.type === 'location');
      } else {
        validParents = state.locations.filter(l => (!existing || l.id !== existing.id) && (l.type === 'location' || l.type === 'shelf'));
      }
      parentSel.innerHTML = '<option value="">Select parent...</option>' + validParents.map(l=>'<option value="' + l.id + '" ' + (existing&&existing.parentId===l.id?'selected':'') + '>' + CONTAINER_TYPES[l.type].icon + ' ' + escapeHtml(containerPath(l.id)) + '</option>').join('');
    }
  };

  window.updateParentOptionsForContainerType(currentType);

  document.getElementById('saveConBtn').onclick = ()=> saveContainerFromForm(existing);
  if(existing) document.getElementById('delConBtn').onclick = ()=> deleteContainerFlow(existing.id);
};

async function saveContainerFromForm(existing){
  const name = document.getElementById('conName').value.trim();
  if(!name){ toast('Please enter a name'); return; }
  const type = document.getElementById('conType').value;
  const parentId = type === 'location' ? null : (document.getElementById('conParent').value || null);
  
  if(type !== 'location' && !parentId){
    toast(t('containerNotEmpty'));
    return;
  }

  const note = document.getElementById('conNote').value.trim();
  if(existing){
    Object.assign(existing, {name, type, parentId, note});
  } else {
    state.locations.push({ id:uid('loc'), name, type, parentId, note, createdAt:Date.now() });
  }
  const ok = await saveLocations(state.locations);
  if(!ok){ toast('Save failed'); return; }
  window.closeOverlay();
  renderSearchRow(); renderMain();
  toast(t('containerSaved'));
}

async function deleteContainerFlow(id){
  if(state.itemsIndex.some(i=>i.locationId===id) || state.locations.some(l=>l.parentId===id)){
    toast(t('containerNotEmpty')); return;
  }
  if(!confirm(t('confirmDeleteContainer'))) return;
  state.locations = state.locations.filter(l=>l.id!==id);
  await saveLocations(state.locations);
  window.closeOverlay();
  renderSearchRow(); renderMain();
  toast(t('containerDeleted'));
}

window.openItemForm = function(existingIndexEntry){

    window.openContainerForm(null);
    return;
  }
  state.photosDraft = [];

  const locOptions = state.locations.map(l=>'<option value="' + l.id + '">' + CONTAINER_TYPES[l.type].icon + ' ' + escapeHtml(containerPath(l.id)) + '</option>').join('');

  const titleText = existingIndexEntry ? t('editItem') : t('newItem');
  const saveText = existingIndexEntry ? t('saveChanges') : t('createAddItem');
  const delBtnHtml = existingIndexEntry ? '<button class="btn-danger" id="delItemBtn">' + t('deleteItem') + '</button>' : '';

  const html = '<div class="sheet-header"><h2>' + titleText + '</h2><button class="close-btn" onclick="window.closeOverlay()">✕</button></div>' +
    '<label>' + t('photoLabel') + '</label>' +
    '<div class="photo-manager" id="photoManagerContainer"></div>' +
    '<div id="aiNameStatus" class="hint" style="color:var(--accent);"></div>' +
    '<div id="locationSuggestionBox" class="hint" style="background:var(--card); border:1px solid var(--line); padding:10px; border-radius:8px; margin-top:8px; display:none;"></div>' +
    '<label style="display:flex; justify-content:space-between; align-items:center;">' +
      '<span>Name</span>' +
      '<button type="button" id="scanBarcodeBtn" class="btn-secondary" style="padding:2px 8px; font-size:11px;">' + t('scanBarcode') + '</button>' +
    '</label>' +
    '<input type="text" id="itName" placeholder="' + t('itemNamePlaceholder') + '">' +
    '<div id="scannerContainer" style="display:none; margin-top:10px;"><div id="reader" style="width:100%;"></div><button type="button" class="btn-secondary" id="closeScannerBtn" style="margin-top:6px; width:100%;">' + t('closeCamera') + '</button></div>' +
    '<div class="row2">' +
      '<div><label>' + t('quantityToAdd') + '</label><input type="number" id="itQty" min="1" value="1"></div>' +
      '<div>' +
        '<label>' + t('categoryOptional') + '</label>' +
        '<input type="text" id="itCategory" list="catList" placeholder="Tools, Electronics...">' +
        '<datalist id="catList"><option value="Tools"><option value="Electronics"><option value="Stationery"><option value="Apparel"><option value="Kitchen"><option value="Misc"></datalist>' +
      '</div>' +
    '</div>' +
    '<label>' + t('placementLabel') + '</label>' +
    '<select id="itLocation">' + locOptions + '</select>' +
    '<label>' + t('tagsOptional') + '</label>' +
    '<input type="text" id="itTags" placeholder="e.g. frequent, camping">' +
    '<label>' + t('notesSpec') + '</label>' +
    '<textarea id="itNote" placeholder="Any additional notes..."></textarea>' +
    '<button class="btn-primary" id="saveItemBtn">' + saveText + '</button>' +
    delBtnHtml;

  window.openOverlay(html);
  
  // 渲染相片區域
  renderPhotoManager();

  document.getElementById('scanBarcodeBtn').onclick = window.startBarcodeScanner;
  document.getElementById('saveItemBtn').onclick = ()=> saveItemFromForm(existingIndexEntry);

  if(existingIndexEntry){
    document.getElementById('delItemBtn').onclick = ()=> deleteItemFlow(existingIndexEntry.id);
    getItem(existingIndexEntry.id).then(full=>{
      if(!full) return;
      document.getElementById('itName').value = full.name||'';
      document.getElementById('itQty').value = 1;
      document.getElementById('itCategory').value = full.category||'';
      document.getElementById('itLocation').value = full.locationId||'';
      document.getElementById('itTags').value = full.tags||'';
      document.getElementById('itNote').value = full.note||'';
      if(full.photos && full.photos.length > 0){
        state.photosDraft = [...full.photos];
        renderPhotoManager();
      } else if(full.photo){
        state.photosDraft = [{ full: full.photo, thumb: full.thumb||full.photo, hash: full.photoHash||0 }];
        renderPhotoManager();
      }
    });
  }
};

function renderPhotoManager(){
  const container = document.getElementById('photoManagerContainer');
  const addBtnHTML = '<label class="add-photo-btn" for="photoInput">' +
      '<span style="font-size:18px;">＋</span>' + t('addPhoto') +
    '</label>' +
    '<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">';
  
  let thumbsHTML = state.photosDraft.map((p, idx)=>
    '<div class="photo-thumb-item">' +
      '<img src="' + p.thumb + '">' +
      '<button type="button" class="del-photo" onclick="window.removePhotoDraft(' + idx + ')">✕</button>' +
    '</div>'
  ).join('');

  container.innerHTML = thumbsHTML + addBtnHTML;
  document.getElementById('photoInput').onchange = window.handlePhotoInput;
}

window.removePhotoDraft = function(idx) {
  state.photosDraft.splice(idx, 1);
  renderPhotoManager();
};

let html5QrCode = null;
window.startBarcodeScanner = function(){
  const container = document.getElementById('scannerContainer');
  container.style.display = 'block';
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (decodedText) => {
      document.getElementById('itName').value = "Barcode: " + decodedText;
      window.stopBarcodeScanner();
      toast(t('barcodeSuccess'));
    },
    (errorMessage) => {}
  ).catch(err => {
    toast(t('camError'));
    container.style.display = 'none';
  });
  document.getElementById('closeScannerBtn').onclick = window.stopBarcodeScanner;
};

window.stopBarcodeScanner = function(){
  if(html5QrCode){
    html5QrCode.stop().then(()=>{
      document.getElementById('scannerContainer').style.display = 'none';
    }).catch(err => {
      document.getElementById('scannerContainer').style.display = 'none';
    });
  } else {
    document.getElementById('scannerContainer').style.display = 'none';
  }
};

window.handlePhotoInput = async function(e){
  const file = e.target.files[0];
  if(!file) return;
  const aiStatus = document.getElementById('aiNameStatus');
  const suggestionBox = document.getElementById('locationSuggestionBox');
  aiStatus.innerHTML = '<span class="loading-dot"></span>Processing photo & matching history...';

  try{
    const processed = await compressImage(file, 900, 0.72);

    let matchedItem = null;
    let fullMatchedRecord = null;
    for(const indexEntry of state.itemsIndex){
      const fullRec = await getItem(indexEntry.id);
      if(fullRec && fullRec.photoHash && Math.abs(fullRec.photoHash - processed.hash) < 15000){
        matchedItem = indexEntry;
        fullMatchedRecord = fullRec;
        break;
      }
    }

    if(matchedItem && fullMatchedRecord){
      state.matchedExistingItem = fullMatchedRecord;
      document.getElementById('itName').value = fullMatchedRecord.name;
      if(fullMatchedRecord.category) document.getElementById('itCategory').value = fullMatchedRecord.category;
      if(fullMatchedRecord.tags) document.getElementById('itTags').value = fullMatchedRecord.tags;
      if(fullMatchedRecord.note) document.getElementById('itNote').value = fullMatchedRecord.note;
      
      const suggestedPlacementName = containerPath(fullMatchedRecord.locationId) || 'Unassigned';
      document.getElementById('itLocation').value = fullMatchedRecord.locationId || '';

      suggestionBox.style.display = 'block';
      suggestionBox.innerHTML = t('smartGuidance') + '<b>' + escapeHtml(suggestedPlacementName) + '</b> (Quantity will be accumulated).';
      
      aiStatus.textContent = "🎯 Recognized identical item: " + fullMatchedRecord.name;
      toast('Identical item matched');
      return;
    }

    state.photosDraft.push(processed);
    renderPhotoManager();
    aiStatus.textContent = "✨ Photo added successfully!";
  }catch(err){
    toast(t('imgFailed'));
    aiStatus.textContent = '';
  }
};

async function saveItemFromForm(existingIndexEntry){
  window.stopBarcodeScanner();
  const name = document.getElementById('itName').value.trim();
  if(!name){ toast('Please enter item name'); return; }
  const addQty = parseFloat(document.getElementById('itQty').value) || 1;
  const category = document.getElementById('itCategory').value.trim();
  const locationId = document.getElementById('itLocation').value;
  const tags = document.getElementById('itTags').value.trim();
  const note = document.getElementById('itNote').value.trim();
  const now = Date.now();

  let targetItem = existingIndexEntry ? await getItem(existingIndexEntry.id) : state.matchedExistingItem;

  if(targetItem){
    targetItem.qty = (parseFloat(targetItem.qty) || 1) + addQty;
    targetItem.category = category || targetItem.category;
    targetItem.locationId = locationId || targetItem.locationId;
    targetItem.tags = tags || targetItem.tags;
    targetItem.note = note || targetItem.note;
    targetItem.updatedAt = now;

    if(state.photosDraft.length > 0){
      if(!targetItem.photos) targetItem.photos = [];
      targetItem.photos = targetItem.photos.concat(state.photosDraft);
    }

    await saveItemRecord(targetItem);

    const indexEntry = { id: targetItem.id, name: targetItem.name, qty: targetItem.qty, category: targetItem.category, locationId: targetItem.locationId, tags: targetItem.tags, thumb: targetItem.thumb || (targetItem.photos[0] ? targetItem.photos[0].thumb : undefined), updatedAt: now };
    const idx = state.itemsIndex.findIndex(i=>i.id===targetItem.id);
    if(idx>=0) state.itemsIndex[idx]=indexEntry; else state.itemsIndex.push(indexEntry);
    await saveItemsIndex(state.itemsIndex);

    window.closeOverlay();
    renderSearchRow(); renderMain();
    toast(t('qtyAccumulated') + targetItem.qty);
    return;
  }

  let id = uid('item');
  let createdAt = now;
  const photos = state.photosDraft;
  const firstPhoto = photos.length > 0 ? photos[0] : null;
  const photo = firstPhoto ? firstPhoto.full : undefined;
  const thumb = firstPhoto ? firstPhoto.thumb : undefined;
  const photoHash = firstPhoto ? firstPhoto.hash : undefined;

  const fullRecord = { id, name, qty: addQty, category, locationId, tags, note, photos, photo, photoHash, createdAt, updatedAt: now };
  await saveItemRecord(fullRecord);

  const indexEntry = { id, name, qty: addQty, category, locationId, tags, thumb, updatedAt: now };
  state.itemsIndex.push(indexEntry);
  await saveItemsIndex(state.itemsIndex);

  window.closeOverlay();
  renderSearchRow(); renderMain();
  toast(t('itemCreated'));
}

async function deleteItemFlow(id){
  if(!confirm(t('confirmDeleteItem'))) return;
  state.itemsIndex = state.itemsIndex.filter(i=>i.id!==id);
  await saveItemsIndex(state.itemsIndex);
  await deleteItemRecord(id);
  window.closeOverlay();
  renderSearchRow(); renderMain();
  toast(t('itemDeleted'));
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

init();
