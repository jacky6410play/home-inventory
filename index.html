<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>家庫 · 家用庫存管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1EEE2;
    --card:#FFFFFF;
    --ink:#20241C;
    --ink-soft:#6A6F62;
    --ink-faint:#9A9C8F;
    --line:#DCD6C4;
    --shelf:#B8842E;
    --drawer:#2E6B6E;
    --box:#A6512E;
    --other:#6C6F63;
    --accent:#2E6B6E;
    --accent-ink:#FFFFFF;
    --danger:#B23A34;
    --radius:12px;
    --shadow:0 1px 2px rgba(32,36,28,.08), 0 4px 14px rgba(32,36,28,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-bottom:78px;
  }
  .mono{font-family:'Space Mono',monospace;}

  /* Header */
  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    padding:18px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header.top h1{
    margin:0; font-size:20px; letter-spacing:.01em;
    font-family:'Space Mono',monospace; font-weight:700;
  }
  header.top .count{
    font-size:11px; color:var(--ink-soft); font-family:'Space Mono',monospace;
  }
  .search-row{
    display:flex; gap:8px; margin-top:12px;
  }
  .search-box{
    flex:1; display:flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:8px 10px;
  }
  .search-box input{
    border:none; outline:none; flex:1; font-size:14px; background:transparent; color:var(--ink); font-family:'Inter',sans-serif;
  }
  select.filter-select{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:9px; padding:8px 8px; font-size:12px; font-family:'Inter',sans-serif; max-width:110px;
  }

  /* Tabs content */
  main{flex:1; padding:14px 16px 8px;}
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:34px; margin-bottom:10px;}
  .empty-state p{font-size:13px; line-height:1.6; margin:4px 0;}

  /* Item card */
  .item-card{
    display:flex; gap:12px; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px; margin-bottom:10px; box-shadow:var(--shadow); cursor:pointer;
  }
  .item-thumb{
    width:56px; height:56px; border-radius:8px; object-fit:cover; flex-shrink:0;
    background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--ink-faint);
  }
  .item-info{flex:1; min-width:0;}
  .item-info .name{font-size:14.5px; font-weight:600; margin:0 0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .qty-badge{font-size:11px; color:var(--ink-soft); font-family:'Space Mono',monospace;}

  /* Tag badge — signature element: inventory tag with punch hole */
  .tag-badge{
    display:inline-flex; align-items:center;
    font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.01em;
    color:#fff; padding:3px 9px 3px 15px; line-height:1.5;
    clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%);
    position:relative; white-space:nowrap; max-width:180px; overflow:hidden; text-overflow:ellipsis;
  }
  .tag-badge::after{
    content:''; position:absolute; left:4px; top:50%; transform:translateY(-50%);
    width:3.5px; height:3.5px; border-radius:50%; background:rgba(255,255,255,.9);
  }
  .tag-shelf{background:var(--shelf);}
  .tag-drawer{background:var(--drawer);}
  .tag-box{background:var(--box);}
  .tag-other{background:var(--other);}

  .tags-line{font-size:11px; color:var(--ink-faint); margin-top:2px;}

  /* Location list */
  .loc-group-title{
    font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-soft);
    margin:18px 0 8px; text-transform:uppercase; letter-spacing:.06em;
  }
  .loc-group-title:first-child{margin-top:2px;}
  .loc-card{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; margin-bottom:9px; box-shadow:var(--shadow); cursor:pointer;
  }
  .loc-icon{font-size:20px; width:30px; text-align:center; flex-shrink:0;}
  .loc-body{flex:1; min-width:0;}
  .loc-name{font-size:14px; font-weight:600; margin:0;}
  .loc-path{font-size:11px; color:var(--ink-faint); margin-top:1px;}
  .loc-count{font-size:11px; color:var(--ink-soft); font-family:'Space Mono',monospace; flex-shrink:0;}

  /* FAB */
  .fab{
    position:fixed; right:calc(50% - 240px + 18px); bottom:88px; z-index:30;
    width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff; border:none;
    font-size:26px; box-shadow:0 4px 14px rgba(46,107,110,.4);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  @media (max-width:480px){ .fab{ right:18px; } }

  /* Bottom nav */
  nav.bottom{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:var(--card);
    border-top:1px solid var(--line); display:flex; z-index:25;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottom button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-faint); font-size:10.5px; font-family:'Inter',sans-serif; cursor:pointer; padding:4px;
  }
  nav.bottom button .ic{font-size:19px;}
  nav.bottom button.active{color:var(--accent); font-weight:600;}

  /* Modal / sheet */
  .overlay{
    position:fixed; inset:0; background:rgba(32,36,28,.42); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--paper); width:100%; max-width:480px; border-radius:18px 18px 0 0;
    max-height:92vh; overflow-y:auto; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-header h2{font-family:'Space Mono',monospace; font-size:16px; margin:0;}
  .close-btn{background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; line-height:1; padding:4px;}

  .action-choice{
    display:flex; flex-direction:column; gap:10px;
  }
  .action-choice button{
    display:flex; align-items:center; gap:12px; padding:14px; border-radius:var(--radius);
    background:var(--card); border:1px solid var(--line); font-size:14px; font-weight:600; color:var(--ink);
    cursor:pointer; text-align:left;
  }
  .action-choice button .ic{font-size:20px;}

  label{display:block; font-size:12px; color:var(--ink-soft); margin:14px 0 6px; font-weight:600;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], select, textarea{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:9px;
    background:var(--card); color:var(--ink); font-size:14px; font-family:'Inter',sans-serif; outline:none;
  }
  textarea{resize:vertical; min-height:60px;}
  .hint{font-size:11px; color:var(--ink-faint); margin-top:5px;}

  .photo-picker{
    display:flex; align-items:center; gap:12px;
  }
  .photo-preview{
    width:76px; height:76px; border-radius:10px; object-fit:cover; border:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:26px;
  }
  .photo-btns{display:flex; flex-direction:column; gap:6px;}
  .btn-secondary{
    padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card);
    font-size:12.5px; color:var(--ink); cursor:pointer;
  }
  .btn-primary{
    width:100%; margin-top:20px; padding:13px; border-radius:10px; border:none;
    background:var(--accent); color:#fff; font-size:14.5px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-danger{
    width:100%; margin-top:10px; padding:11px; border-radius:10px; border:1px solid var(--danger);
    background:transparent; color:var(--danger); font-size:13px; font-weight:600; cursor:pointer;
  }
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}

  /* Detail view */
  .detail-photo{
    width:100%; aspect-ratio:1/1; border-radius:14px; object-fit:cover; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:40px; color:var(--ink-faint); margin-bottom:14px;
  }
  .detail-title{font-size:19px; font-weight:700; margin:0 0 8px;}
  .detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .detail-row .k{color:var(--ink-soft);}
  .detail-row .v{font-weight:600; text-align:right; max-width:65%;}
  .note-block{font-size:13px; color:var(--ink); line-height:1.6; margin-top:10px; white-space:pre-wrap;}
  .tag-chip{display:inline-block; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:3px 10px; font-size:11px; margin:3px 4px 0 0; color:var(--ink-soft);}
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:80;
    background:var(--ink); color:#fff; padding:9px 16px; border-radius:20px; font-size:12.5px; box-shadow:var(--shadow);
  }
  .loading-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:6px; animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1>家庫 HomeStock</h1>
      <span class="count mono" id="headerCount"></span>
    </div>
    <div class="search-row" id="searchRow"></div>
  </header>
  <main id="main"></main>
  <button class="fab" id="fabBtn">＋</button>
  <nav class="bottom">
    <button data-tab="items" class="active"><span class="ic">🗂️</span>物品</button>
    <button data-tab="locations"><span class="ic">🏷️</span>儲位</button>
  </nav>
</div>
<div id="overlayRoot"></div>

<script>
/* =========================================================
   資料層 (Storage layer)
   目前使用瀏覽器內建的 IndexedDB 當作示範資料庫——這是標準
   瀏覽器功能，不管是本機打開、還是部署到 GitHub Pages 之後，
   資料都會真正存在「這支手機、這個瀏覽器」裡，重開機、重新整理
   都不會消失，但換一台裝置或清除瀏覽器資料就會不見。
   之後若要換成 Google Drive，只需要改寫這一段
   (getLocations / saveLocations / getItemsIndex / saveItemsIndex /
    getItem / saveItem / deleteItemRecord) 的實作即可，
   上層的畫面與邏輯完全不用動。
========================================================= */
const STORE_KEYS = { LOCATIONS:'locations', ITEMS_INDEX:'items-index', ITEM_PREFIX:'item:' };

const DB_NAME = 'homestock-db';
const DB_STORE = 'kv';
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(DB_STORE, {keyPath:'key'}); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return dbPromise;
}
async function safeGet(key){
  try{
    const db = await openDB();
    return await new Promise(resolve=>{
      const tx = db.transaction(DB_STORE,'readonly');
      const req = tx.objectStore(DB_STORE).get(key);
      req.onsuccess = ()=> resolve(req.result ? req.result.value : null);
      req.onerror = ()=> resolve(null);
    });
  }catch(e){ console.error('storage get failed', key, e); return null; }
}
async function safeSet(key, value){
  try{
    const db = await openDB();
    return await new Promise(resolve=>{
      const tx = db.transaction(DB_STORE,'readwrite');
      tx.objectStore(DB_STORE).put({key, value});
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> resolve(false);
    });
  }catch(e){ console.error('storage set failed', key, e); return false; }
}
async function safeDelete(key){
  try{
    const db = await openDB();
    await new Promise(resolve=>{
      const tx = db.transaction(DB_STORE,'readwrite');
      tx.objectStore(DB_STORE).delete(key);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> resolve();
    });
  }catch(e){}
}

async function getLocations(){ return (await safeGet(STORE_KEYS.LOCATIONS)) || []; }
async function saveLocations(list){ return safeSet(STORE_KEYS.LOCATIONS, list); }
async function getItemsIndex(){ return (await safeGet(STORE_KEYS.ITEMS_INDEX)) || []; }
async function saveItemsIndex(list){ return safeSet(STORE_KEYS.ITEMS_INDEX, list); }
async function getItem(id){ return safeGet(STORE_KEYS.ITEM_PREFIX+id); }
async function saveItemRecord(item){ return safeSet(STORE_KEYS.ITEM_PREFIX+item.id, item); }
async function deleteItemRecord(id){ return safeDelete(STORE_KEYS.ITEM_PREFIX+id); }

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* =========================================================
   狀態
========================================================= */
let state = {
  tab:'items',
  locations:[],
  itemsIndex:[],
  query:'',
  locationFilter:'',
  editingItem:null,   // full item record being added/edited
  editingLocation:null,
  photoDraft:null,    // {full, thumb} base64 while composing item
};

const LOC_TYPES = {
  shelf:{label:'層架', icon:'📚', cls:'tag-shelf'},
  drawer:{label:'抽屜', icon:'🗃️', cls:'tag-drawer'},
  box:{label:'箱', icon:'📦', cls:'tag-box'},
  other:{label:'其他', icon:'🏷️', cls:'tag-other'},
};

function locationById(id){ return state.locations.find(l=>l.id===id); }
function locationPath(id){
  const parts=[]; let cur=locationById(id); let guard=0;
  while(cur && guard<8){ parts.unshift(cur.name); cur = cur.parentId? locationById(cur.parentId): null; guard++; }
  return parts.join(' › ');
}
function locationTypeOf(id){
  const l=locationById(id); return l? l.type : 'other';
}

/* =========================================================
   圖片壓縮
========================================================= */
function compressImage(file, maxSize, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; }
        else if(h>=w && h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   Toast
========================================================= */
function toast(msg){
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('overlayRoot').appendChild(el);
  setTimeout(()=>el.remove(),1800);
}

/* =========================================================
   初始化
========================================================= */
async function init(){
  renderMain(); // loading state
  state.locations = await getLocations();
  state.itemsIndex = await getItemsIndex();
  renderSearchRow();
  renderMain();
}

/* =========================================================
   Header search row
========================================================= */
function renderSearchRow(){
  const row = document.getElementById('searchRow');
  if(state.tab!=='items'){ row.innerHTML=''; return; }
  row.innerHTML = `
    <div class="search-box">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="搜尋物品名稱、標籤…" value="${escapeAttr(state.query)}">
    </div>
    <select class="filter-select" id="locFilterSelect">
      <option value="">全部儲位</option>
      ${state.locations.map(l=>`<option value="${l.id}" ${state.locationFilter===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}
    </select>
  `;
  document.getElementById('searchInput').addEventListener('input', e=>{ state.query=e.target.value; renderMain(); });
  document.getElementById('locFilterSelect').addEventListener('change', e=>{ state.locationFilter=e.target.value; renderMain(); });
}

/* =========================================================
   主畫面渲染
========================================================= */
function renderMain(){
  const main = document.getElementById('main');
  document.getElementById('headerCount').textContent = state.tab==='items'
    ? `${state.itemsIndex.length} 件物品`
    : `${state.locations.length} 個儲位`;

  if(state.tab==='items'){ main.innerHTML = renderItemsList(); bindItemCardClicks(); }
  else { main.innerHTML = renderLocationsList(); bindLocationCardClicks(); }
}

function renderItemsList(){
  let list = state.itemsIndex;
  if(state.locationFilter) list = list.filter(i=>i.locationId===state.locationFilter);
  if(state.query.trim()){
    const q=state.query.trim().toLowerCase();
    list = list.filter(i => (i.name||'').toLowerCase().includes(q) || (i.tags||'').toLowerCase().includes(q) || (i.category||'').toLowerCase().includes(q));
  }
  if(list.length===0){
    return `<div class="empty-state"><div class="glyph">📦</div>
      <p>${state.itemsIndex.length===0 ? '還沒有任何物品' : '找不到符合的物品'}</p>
      <p>${state.itemsIndex.length===0 ? '點右下角「＋」開始建立第一筆庫存' : '換個關鍵字或篩選條件試試'}</p>
    </div>`;
  }
  list = [...list].sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
  return list.map(it=>{
    const t = locationTypeOf(it.locationId);
    const tinfo = LOC_TYPES[t] || LOC_TYPES.other;
    const thumb = it.thumb
      ? `<img class="item-thumb" src="${it.thumb}">`
      : `<div class="item-thumb">${tinfo.icon}</div>`;
    return `
    <div class="item-card" data-id="${it.id}">
      ${thumb}
      <div class="item-info">
        <p class="name">${escapeHtml(it.name)}</p>
        <div class="item-meta">
          <span class="qty-badge">×${it.qty ?? 1}</span>
          ${it.locationId ? `<span class="tag-badge ${tinfo.cls}">${escapeHtml(locationPath(it.locationId)||'未分類')}</span>` : `<span class="tag-badge tag-other">未指定儲位</span>`}
        </div>
        ${it.tags ? `<div class="tags-line">${escapeHtml(it.tags)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderLocationsList(){
  if(state.locations.length===0){
    return `<div class="empty-state"><div class="glyph">🏷️</div>
      <p>還沒有建立任何儲位</p>
      <p>先建立像「客廳層架」「工具箱」這樣的儲位，之後物品才有地方放</p>
    </div>`;
  }
  const groups = {shelf:[],drawer:[],box:[],other:[]};
  state.locations.forEach(l=> (groups[l.type]||groups.other).push(l));
  let html='';
  Object.keys(LOC_TYPES).forEach(typeKey=>{
    const arr = groups[typeKey];
    if(!arr || arr.length===0) return;
    html += `<div class="loc-group-title">${LOC_TYPES[typeKey].icon} ${LOC_TYPES[typeKey].label} · ${arr.length}</div>`;
    html += arr.map(l=>{
      const count = state.itemsIndex.filter(i=>i.locationId===l.id).length;
      const path = l.parentId ? locationPath(l.parentId) : '';
      return `
      <div class="loc-card" data-id="${l.id}">
        <div class="loc-icon">${LOC_TYPES[l.type]?.icon || '🏷️'}</div>
        <div class="loc-body">
          <p class="loc-name">${escapeHtml(l.name)}</p>
          ${path ? `<div class="loc-path">位於 ${escapeHtml(path)}</div>` : ''}
        </div>
        <div class="loc-count">${count} 件</div>
      </div>`;
    }).join('');
  });
  return html;
}

function bindItemCardClicks(){
  document.querySelectorAll('.item-card').forEach(card=>{
    card.addEventListener('click', ()=> openItemDetail(card.dataset.id));
  });
}
function bindLocationCardClicks(){
  document.querySelectorAll('.loc-card').forEach(card=>{
    card.addEventListener('click', ()=> openLocationDetail(card.dataset.id));
  });
}

/* =========================================================
   Overlay 系統
========================================================= */
function openOverlay(html){
  const root=document.getElementById('overlayRoot');
  root.innerHTML = `<div class="overlay" id="ovBg"><div class="sheet">${html}</div></div>`;
  document.getElementById('ovBg').addEventListener('click', e=>{ if(e.target.id==='ovBg') closeOverlay(); });
}
function closeOverlay(){ document.getElementById('overlayRoot').innerHTML=''; state.photoDraft=null; }

/* =========================================================
   FAB → 選擇新增物品 / 新增儲位
========================================================= */
document.getElementById('fabBtn').addEventListener('click', ()=>{
  openOverlay(`
    <div class="sheet-header"><h2>新增</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    <div class="action-choice">
      <button id="choiceItem"><span class="ic">🗂️</span>新增物品</button>
      <button id="choiceLoc"><span class="ic">🏷️</span>新增儲位</button>
    </div>
  `);
  document.getElementById('choiceItem').addEventListener('click', ()=> openItemForm(null));
  document.getElementById('choiceLoc').addEventListener('click', ()=> openLocationForm(null));
});

/* =========================================================
   儲位表單 (新增 / 編輯)
========================================================= */
function openLocationForm(existing){
  state.editingLocation = existing;
  const parentOptions = state.locations
    .filter(l=> !existing || l.id!==existing.id)
    .map(l=>`<option value="${l.id}" ${existing&&existing.parentId===l.id?'selected':''}>${escapeHtml(locationPath(l.id))}</option>`).join('');
  openOverlay(`
    <div class="sheet-header"><h2>${existing?'編輯儲位':'新增儲位'}</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    <label>名稱</label>
    <input type="text" id="locName" placeholder="例如：客廳層架、工具箱" value="${existing?escapeAttr(existing.name):''}">
    <label>類型</label>
    <select id="locType">
      ${Object.entries(LOC_TYPES).map(([k,v])=>`<option value="${k}" ${existing&&existing.type===k?'selected':''}>${v.icon} ${v.label}</option>`).join('')}
    </select>
    <label>上層儲位（選填，例如放在哪個層架上）</label>
    <select id="locParent">
      <option value="">無</option>
      ${parentOptions}
    </select>
    <label>備註（選填）</label>
    <textarea id="locNote" placeholder="任何補充說明…">${existing?escapeHtml(existing.note||''):''}</textarea>
    <button class="btn-primary" id="saveLocBtn">${existing?'儲存變更':'建立儲位'}</button>
    ${existing?'<button class="btn-danger" id="delLocBtn">刪除此儲位</button>':''}
  `);
  document.getElementById('saveLocBtn').addEventListener('click', saveLocationFromForm);
  if(existing){
    document.getElementById('delLocBtn').addEventListener('click', ()=> deleteLocationFlow(existing.id));
  }
}

async function saveLocationFromForm(){
  const name = document.getElementById('locName').value.trim();
  if(!name){ toast('請輸入儲位名稱'); return; }
  const type = document.getElementById('locType').value;
  const parentId = document.getElementById('locParent').value || null;
  const note = document.getElementById('locNote').value.trim();
  if(state.editingLocation){
    Object.assign(state.editingLocation, {name,type,parentId,note});
  } else {
    state.locations.push({ id:uid('loc'), name, type, parentId, note, createdAt:Date.now() });
  }
  const ok = await saveLocations(state.locations);
  if(!ok){ toast('儲存失敗，請再試一次'); return; }
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('儲位已儲存');
}

async function deleteLocationFlow(id){
  const inUse = state.itemsIndex.some(i=>i.locationId===id);
  const hasChildren = state.locations.some(l=>l.parentId===id);
  if(inUse || hasChildren){
    toast('此儲位內還有物品或子儲位，請先清空');
    return;
  }
  if(!confirm('確定要刪除這個儲位嗎？')) return;
  state.locations = state.locations.filter(l=>l.id!==id);
  await saveLocations(state.locations);
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('儲位已刪除');
}

/* =========================================================
   儲位詳細頁（顯示裡面的物品）
========================================================= */
function openLocationDetail(id){
  const loc = locationById(id);
  if(!loc) return;
  const items = state.itemsIndex.filter(i=>i.locationId===id);
  const children = state.locations.filter(l=>l.parentId===id);
  openOverlay(`
    <div class="sheet-header"><h2>${LOC_TYPES[loc.type].icon} ${escapeHtml(loc.name)}</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    ${loc.parentId?`<div class="loc-path" style="margin-bottom:10px;">位於 ${escapeHtml(locationPath(loc.parentId))}</div>`:''}
    ${loc.note?`<p class="note-block" style="margin-top:0;">${escapeHtml(loc.note)}</p>`:''}
    <label style="margin-top:6px;">內含物品（${items.length}）</label>
    ${items.length? items.map(it=>`
      <div class="item-card" data-id="${it.id}" style="margin-bottom:8px;">
        ${it.thumb?`<img class="item-thumb" src="${it.thumb}">`:`<div class="item-thumb">${LOC_TYPES[loc.type].icon}</div>`}
        <div class="item-info"><p class="name">${escapeHtml(it.name)}</p><span class="qty-badge">×${it.qty??1}</span></div>
      </div>`).join('') : `<p class="hint">這個儲位目前是空的</p>`}
    ${children.length? `<label>子儲位</label>${children.map(c=>`<div class="loc-card" data-id="${c.id}"><div class="loc-icon">${LOC_TYPES[c.type].icon}</div><div class="loc-body"><p class="loc-name">${escapeHtml(c.name)}</p></div></div>`).join('')}` : ''}
    <button class="btn-primary" id="editLocBtn">編輯儲位</button>
  `);
  document.getElementById('editLocBtn').addEventListener('click', ()=> openLocationForm(loc));
  document.querySelectorAll('#overlayRoot .item-card').forEach(c=> c.addEventListener('click', ()=> openItemDetail(c.dataset.id)));
  document.querySelectorAll('#overlayRoot .loc-card').forEach(c=> c.addEventListener('click', ()=> openLocationDetail(c.dataset.id)));
}

/* =========================================================
   物品表單 (新增 / 編輯)
========================================================= */
function openItemForm(existingIndexEntry){
  if(state.locations.length===0){
    toast('請先建立至少一個儲位');
    openLocationForm(null);
    return;
  }
  state.photoDraft = null;
  const editingFull = existingIndexEntry; // will be loaded async below if editing
  const locOptions = state.locations.map(l=>`<option value="${l.id}">${LOC_TYPES[l.type].icon} ${escapeHtml(locationPath(l.id))}</option>`).join('');

  openOverlay(`
    <div class="sheet-header"><h2>${existingIndexEntry?'編輯物品':'新增物品'}</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    <label>照片（選填）</label>
    <div class="photo-picker">
      <div class="photo-preview" id="photoPreview">🖼️</div>
      <div class="photo-btns">
        <label class="btn-secondary" for="photoInput">拍照 / 選擇圖片</label>
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">
        <button class="btn-secondary" id="clearPhotoBtn" type="button">移除照片</button>
      </div>
    </div>
    <label>名稱</label>
    <input type="text" id="itName" placeholder="例如：十字螺絲起子">
    <div class="row2">
      <div>
        <label>數量</label>
        <input type="number" id="itQty" min="0" value="1">
      </div>
      <div>
        <label>分類（選填）</label>
        <input type="text" id="itCategory" list="catList" placeholder="工具、電子…">
        <datalist id="catList">
          <option value="工具"><option value="電子"><option value="文具"><option value="衣物"><option value="廚房用品"><option value="雜貨">
        </datalist>
      </div>
    </div>
    <label>儲位</label>
    <select id="itLocation">${locOptions}</select>
    <label>標籤（選填，用逗號分隔）</label>
    <input type="text" id="itTags" placeholder="例如：常用, 露營">
    <label>備註（選填）</label>
    <textarea id="itNote" placeholder="任何補充說明…"></textarea>
    <button class="btn-primary" id="saveItemBtn">${existingIndexEntry?'儲存變更':'建立物品'}</button>
    ${existingIndexEntry?'<button class="btn-danger" id="delItemBtn">刪除此物品</button>':''}
  `);

  document.getElementById('photoInput').addEventListener('change', handlePhotoInput);
  document.getElementById('clearPhotoBtn').addEventListener('click', ()=>{
    state.photoDraft = 'REMOVE';
    document.getElementById('photoPreview').innerHTML = '🖼️';
  });
  document.getElementById('saveItemBtn').addEventListener('click', ()=> saveItemFromForm(existingIndexEntry));

  if(existingIndexEntry){
    document.getElementById('delItemBtn').addEventListener('click', ()=> deleteItemFlow(existingIndexEntry.id));
    // load full record async to prefill
    getItem(existingIndexEntry.id).then(full=>{
      if(!full) return;
      document.getElementById('itName').value = full.name||'';
      document.getElementById('itQty').value = full.qty ?? 1;
      document.getElementById('itCategory').value = full.category||'';
      document.getElementById('itLocation').value = full.locationId||'';
      document.getElementById('itTags').value = full.tags||'';
      document.getElementById('itNote').value = full.note||'';
      if(full.photo){
        document.getElementById('photoPreview').innerHTML = `<img src="${full.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">`;
      }
    });
  }
}

async function handlePhotoInput(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById('photoPreview');
  preview.innerHTML = `<span class="loading-dot"></span>`;
  try{
    const full = await compressImage(file, 900, 0.72);
    const thumb = await compressImage(file, 160, 0.6);
    state.photoDraft = {full, thumb};
    preview.innerHTML = `<img src="${thumb}" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">`;
  }catch(err){
    toast('圖片處理失敗，請換一張試試');
    preview.innerHTML = '🖼️';
  }
}

async function saveItemFromForm(existingIndexEntry){
  const name = document.getElementById('itName').value.trim();
  if(!name){ toast('請輸入物品名稱'); return; }
  const qty = parseFloat(document.getElementById('itQty').value) || 0;
  const category = document.getElementById('itCategory').value.trim();
  const locationId = document.getElementById('itLocation').value;
  const tags = document.getElementById('itTags').value.trim();
  const note = document.getElementById('itNote').value.trim();
  const now = Date.now();

  let id, createdAt, photo, thumb;
  if(existingIndexEntry){
    id = existingIndexEntry.id;
    const prevFull = await getItem(id) || {};
    createdAt = prevFull.createdAt || now;
    photo = prevFull.photo; thumb = existingIndexEntry.thumb;
  } else {
    id = uid('item'); createdAt = now;
  }
  if(state.photoDraft === 'REMOVE'){ photo=undefined; thumb=undefined; }
  else if(state.photoDraft && state.photoDraft.full){ photo=state.photoDraft.full; thumb=state.photoDraft.thumb; }

  const fullRecord = { id, name, qty, category, locationId, tags, note, photo, createdAt, updatedAt: now };
  const okFull = await saveItemRecord(fullRecord);
  if(!okFull){ toast('儲存失敗，請再試一次'); return; }

  const indexEntry = { id, name, qty, category, locationId, tags, thumb, updatedAt: now };
  const idx = state.itemsIndex.findIndex(i=>i.id===id);
  if(idx>=0) state.itemsIndex[idx]=indexEntry; else state.itemsIndex.push(indexEntry);
  const okIdx = await saveItemsIndex(state.itemsIndex);
  if(!okIdx){ toast('索引儲存失敗'); return; }

  closeOverlay();
  renderSearchRow(); renderMain();
  toast(existingIndexEntry ? '物品已更新' : '物品已建立');
}

async function deleteItemFlow(id){
  if(!confirm('確定要刪除這個物品嗎？')) return;
  state.itemsIndex = state.itemsIndex.filter(i=>i.id!==id);
  await saveItemsIndex(state.itemsIndex);
  await deleteItemRecord(id);
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('物品已刪除');
}

/* =========================================================
   物品詳細頁
========================================================= */
async function openItemDetail(id){
  const indexEntry = state.itemsIndex.find(i=>i.id===id);
  if(!indexEntry) return;
  openOverlay(`<div class="sheet-header"><h2>物品詳情</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div><p class="hint"><span class="loading-dot"></span>載入中…</p>`);
  const full = await getItem(id);
  if(!full){ toast('讀取失敗'); closeOverlay(); return; }
  const t = locationTypeOf(full.locationId);
  const tinfo = LOC_TYPES[t]||LOC_TYPES.other;
  document.querySelector('#overlayRoot .sheet').innerHTML = `
    <div class="sheet-header"><h2>物品詳情</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    ${full.photo ? `<img class="detail-photo" src="${full.photo}">` : `<div class="detail-photo">${tinfo.icon}</div>`}
    <p class="detail-title">${escapeHtml(full.name)}</p>
    <div class="detail-row"><span class="k">數量</span><span class="v">${full.qty ?? 1}</span></div>
    ${full.category?`<div class="detail-row"><span class="k">分類</span><span class="v">${escapeHtml(full.category)}</span></div>`:''}
    <div class="detail-row"><span class="k">儲位</span><span class="v"><span class="tag-badge ${tinfo.cls}">${escapeHtml(locationPath(full.locationId)||'未指定')}</span></span></div>
    <div class="detail-row"><span class="k">更新時間</span><span class="v">${new Date(full.updatedAt).toLocaleString('zh-TW')}</span></div>
    ${full.tags ? `<div style="margin-top:10px;">${full.tags.split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    ${full.note ? `<div class="note-block">${escapeHtml(full.note)}</div>` : ''}
    <button class="btn-primary" id="editItemBtn">編輯物品</button>
  `;
  document.getElementById('editItemBtn').addEventListener('click', ()=> openItemForm(indexEntry));
}

/* =========================================================
   Bottom nav
========================================================= */
document.querySelectorAll('nav.bottom button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    renderSearchRow();
    renderMain();
  });
});

/* =========================================================
   Utils
========================================================= */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

init();
</script>
</body>
</html>
