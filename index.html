<script>
function getDynamicVersion(){
  const now = new Date();
  const yy = String(now.getFullYear()).slice(-2);
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const hh = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  return `r${yy}.${mm}.${dd}.${hh}${min}${ss}`;
}

const APP_VERSION = getDynamicVersion();
const VERSION_LOG = [
  { v: APP_VERSION, note:'Fixed desktop bottom navbar width to span 100% of the left sidebar.' },
  { v:'r26.0828.204412', note:'Refined storage types: Box, Drawer, and Cabinet under Storage tier.' },
  { v:'r26.0828.204105', note:'Redefined hierarchy: Location > Shelf > Storage, with dependency validation.' },
];

const STORE_KEYS = { LOCATIONS:'locations', ITEMS_INDEX:'items-index', ITEM_PREFIX:'item:' };
const GOOGLE_CLIENT_ID = '412152569230-fpq2tbie8v12ki3rb2nuhno0tq46cjl6.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_NAME = 'HomeStock 家庫資料';

let driveState = { accessToken:null, tokenClient:null, folderId:null };

document.getElementById('loginVersionTag').textContent = APP_VERSION;
document.getElementById('loginVersionTag').addEventListener('click', showVersionLog);

function waitForGoogle(){
  return new Promise(resolve=>{
    (function tryInit(){
      if(window.google && google.accounts && google.accounts.oauth2) resolve();
      else setTimeout(tryInit, 100);
    })();
  });
}

async function initTokenClient(){
  await waitForGoogle();
  driveState.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: ()=>{},
  });
}

function requestAccessToken(interactive){
  return new Promise((resolve, reject)=>{
    driveState.tokenClient.callback = (resp)=>{
      if(resp.error){ reject(resp); return; }
      driveState.accessToken = resp.access_token;
      resolve(resp.access_token);
    };
    driveState.tokenClient.requestAccessToken({ prompt: interactive ? 'select_account' : '' });
  });
}

async function driveFetch(url, options={}, allowRetry=true){
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer '+driveState.accessToken });
  const res = await fetch(url, options);
  if(res.status===401 && allowRetry){
    await requestAccessToken(false);
    return driveFetch(url, options, false);
  }
  return res;
}

async function ensureFolder(){
  if(driveState.folderId) return driveState.folderId;
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  if(data.files && data.files.length>0){ driveState.folderId = data.files[0].id; return driveState.folderId; }
  const createRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder' }),
  });
  const created = await createRes.json();
  driveState.folderId = created.id;
  return driveState.folderId;
}

async function findFileId(name){
  const folderId = await ensureFolder();
  const q = encodeURIComponent(`name='${name}' and '${folderId}' in parents and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function safeGet(key){
  try{
    const fileId = await findFileId(key+'.json');
    if(!fileId) return null;
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

async function safeSet(key, value){
  try{
    const folderId = await ensureFolder();
    const name = key+'.json';
    const existingId = await findFileId(name);
    const content = JSON.stringify(value);
    if(existingId){
      const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`, {
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body: content,
      });
      return res.ok;
    } else {
      const boundary = 'homestock-'+Date.now();
      const metadata = { name, parents:[folderId] };
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n`+
        `--${boundary}--`;
      const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`, {
        method:'POST',
        headers:{'Content-Type': `multipart/related; boundary=${boundary}`},
        body,
      });
      return res.ok;
    }
  }catch(e){ return false; }
}

async function safeDelete(key){
  try{
    const fileId = await findFileId(key+'.json');
    if(!fileId) return;
    await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, { method:'DELETE' });
  }catch(e){}
}

async function getLocations(){ return (await safeGet(STORE_KEYS.LOCATIONS)) || []; }
async function saveLocations(list){ return safeSet(STORE_KEYS.LOCATIONS, list); }
async function getItemsIndex(){ return (await safeGet(STORE_KEYS.ITEMS_INDEX)) || []; }
async function saveItemsIndex(list){ return safeSet(STORE_KEYS.ITEMS_INDEX, list); }
async function getItem(id){ return safeGet(STORE_KEYS.ITEM_PREFIX+id); }
async function saveItemRecord(item){ return safeSet(STORE_KEYS.ITEM_PREFIX+item.id, item); }
async function deleteItemRecord(id){ return safeDelete(STORE_KEYS.ITEM_PREFIX+id); }

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

let state = {
  tab:'items',
  locations:[],
  itemsIndex:[],
  query:'',
  locationFilter:'',

const CONTAINER_TYPES = {
  location:{label:'Location (最大存放地)', icon:'🏠', cls:'tag-location'},
  shelf:{label:'Shelf (料架)', icon:'📚', cls:'tag-shelf'},
  box:{label:'Box (箱子)', icon:'📦', cls:'tag-storage'},
  drawer:{label:'Drawer (抽屜)', icon:'🗄️', cls:'tag-storage'},
  cabinet:{label:'Cabinet (櫃子)', icon:'🚪', cls:'tag-storage'},
};

function containerById(id){ return state.locations.find(l=>l.id===id); }
function containerPath(id){
  const parts=[]; let cur=containerById(id); let guard=0;
  while(cur && guard<8){ parts.unshift(cur.name); cur = cur.parentId? containerById(cur.parentId): null; guard++; }
  return parts.join(' › ');
}
function containerTypeOf(id){
  const l=containerById(id); return l? l.type : 'location';
}

function compressImage(file, maxSize, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; }
        else if(h>=w && h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        
        const data = ctx.getImageData(0, 0, 32, 32).data;
        let hash = 0;
        for (let i = 0; i < data.length; i += 4) {
          hash = ((hash << 5) - hash) + (data[i] + data[i+1] + data[i+2]);
          hash |= 0;
        }

        resolve({full: canvas.toDataURL('image/jpeg', quality), thumb: canvas.toDataURL('image/jpeg', 0.6), hash: Math.abs(hash)});
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function toast(msg){
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('overlayRoot').appendChild(el);
  setTimeout(()=>el.remove(),1800);
}

async function init(){
  await initTokenClient();
  document.getElementById('authSigninBtn').addEventListener('click', doSignIn);
  document.getElementById('cloudBtn').addEventListener('click', openAccountSheet);
}

async function doSignIn(){
  const statusEl = document.getElementById('authStatus');
  statusEl.innerHTML = '<span class="loading-dot"></span>Connecting...';
  try{
    await requestAccessToken(true);
    statusEl.textContent = 'Preparing directory...';
    await ensureFolder();
    await afterSignIn();
  }catch(e){
    statusEl.textContent = 'Sign-in failed or cancelled, please try again';
  }
}

async function afterSignIn(){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  const vTag = document.getElementById('versionTag');
  vTag.textContent = APP_VERSION;
  vTag.addEventListener('click', showVersionLog);
  renderMain();
  state.locations = await getLocations();
  state.itemsIndex = await getItemsIndex();
  renderSearchRow();
  renderMain();
}

function openAccountSheet(){
  openOverlay(`
    <div class="sheet-header"><h2>☁️ Cloud & Backup</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    <p class="hint">Data is synced to Google Drive folder "${DRIVE_FOLDER_NAME}".</p>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn-secondary" id="exportJsonBtn" style="flex:1;">📥 Export Backup (JSON)</button>
      <button class="btn-secondary" id="exportCsvBtn" style="flex:1;">📊 Export Excel (CSV)</button>
    </div>
    <button class="btn-danger" id="signOutBtn" style="margin-top:20px;">Sign Out</button>
  `);
  document.getElementById('signOutBtn').addEventListener('click', doSignOut);
  document.getElementById('exportJsonBtn').addEventListener('click', exportJsonData);
  document.getElementById('exportCsvBtn').addEventListener('click', exportCsvData);
}

async function exportJsonData(){
  const allData = { locations: state.locations, items: state.itemsIndex, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(allData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `homestock-backup-${Date.now()}.json`;
  a.click();
  toast('JSON backup exported');
}

async function exportCsvData(){
  let csv = '\uFEFFName,Quantity,Category,Placement,Tags,Updated\n';
  state.itemsIndex.forEach(i=>{
    const locName = containerPath(i.locationId) || 'Unassigned';
    csv += `"${i.name || ''}",${i.qty || 1},"${i.category || ''}","${locName}","${i.tags || ''}","${new Date(i.updatedAt).toLocaleString()}"\n`;
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `homestock-inventory-${Date.now()}.csv`;
  a.click();
  toast('CSV spreadsheet exported');
}

function doSignOut(){
  if(driveState.accessToken){
    try{ google.accounts.oauth2.revoke(driveState.accessToken, ()=>{}); }catch(e){}
  }
  driveState.accessToken = null; driveState.folderId = null;
  state.locations = []; state.itemsIndex = [];
  closeOverlay();
  document.getElementById('app').style.display = 'none';
  document.getElementById('authGate').style.display = 'flex';
  document.getElementById('authStatus').textContent = '';
}

function renderSearchRow(){
  const row = document.getElementById('searchRow');
  if(state.tab!=='items'){ row.innerHTML=''; return; }
  row.innerHTML = `
    <div class="search-box">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="Search name, tags..." value="${escapeAttr(state.query)}">
    </div>
    <select class="filter-select" id="locFilterSelect">
      <option value="">All Placements</option>
      ${state.locations.map(l=>`<option value="${l.id}" ${state.locationFilter===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}
    </select>
  `;
  document.getElementById('searchInput').addEventListener('input', e=>{ state.query=e.target.value; renderMain(); });
  document.getElementById('locFilterSelect').addEventListener('change', e=>{ state.locationFilter=e.target.value; renderMain(); });
}

function renderMain(){
  const main = document.getElementById('main');
  document.getElementById('headerCount').textContent = state.tab==='items'
    ? `${state.itemsIndex.length} items`
    : state.tab==='locations' ? `${state.locations.length} containers` : 'Overview';

  if(state.tab==='items'){ main.innerHTML = renderItemsList(); bindItemCardClicks(); }
  else if(state.tab==='locations'){ main.innerHTML = renderLocationsList(); bindLocationCardClicks(); }
  else { main.innerHTML = renderStatsView(); }
}

function renderItemsList(){
  let list = state.itemsIndex;
  if(state.locationFilter) list = list.filter(i=>i.locationId===state.locationFilter);
  if(state.query.trim()){
    const q=state.query.trim().toLowerCase();
    list = list.filter(i => (i.name||'').toLowerCase().includes(q) || (i.tags||'').toLowerCase().includes(q) || (i.category||'').toLowerCase().includes(q));
  }
  if(list.length===0){
    return `<div class="empty-state"><div class="glyph">📦</div>
      <p>${state.itemsIndex.length===0 ? 'No items found' : 'No matching items'}</p>
      <p>${state.itemsIndex.length===0 ? 'Tap "+" below to create your first inventory item' : 'Try different keywords or filters'}</p>
    </div>`;
  }
  list = [...list].sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
  return list.map(it=>{
    const t = containerTypeOf(it.locationId);
    const tinfo = CONTAINER_TYPES[t] || CONTAINER_TYPES.location;
    const thumb = it.thumb
      ? `<img class="item-thumb" src="${it.thumb}">`
      : `<div class="item-thumb">${tinfo.icon}</div>`;
    return `
    <div class="item-card" data-id="${it.id}">
      ${thumb}
      <div class="item-info">
        <p class="name">${escapeHtml(it.name)}</p>
        <div class="item-meta">
          <span class="qty-badge">×${it.qty ?? 1}</span>
          ${it.locationId ? `<span class="tag-badge ${tinfo.cls}">${escapeHtml(containerPath(it.locationId)||'Unclassified')}</span>` : `<span class="tag-badge tag-location">No Placement</span>`}
        </div>
        ${it.tags ? `<div class="tags-line">${escapeHtml(it.tags)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderLocationsList(){
  if(state.locations.length===0){
    return `<div class="empty-state"><div class="glyph">🏷️</div>
      <p>No locations, shelves, or storage units created yet</p>
      <p>Create a Location first</p>
    </div>`;
  }
  const groups = {location:[],shelf:[],box:[],drawer:[],cabinet:[]};
  state.locations.forEach(l=> (groups[l.type]||groups.location).push(l));
  let html='';
  ['location','shelf','box','drawer','cabinet'].forEach(typeKey=>{
    const arr = groups[typeKey];
    if(!arr || arr.length===0) return;
    html += `<div class="loc-group-title">${CONTAINER_TYPES[typeKey].icon} ${CONTAINER_TYPES[typeKey].label} · ${arr.length}</div>`;
    html += arr.map(l=>{
      const count = state.itemsIndex.filter(i=>i.locationId===l.id).length;
      const path = l.parentId ? containerPath(l.parentId) : '';
      return `
      <div class="loc-card" data-id="${l.id}">
        <div class="loc-icon">${CONTAINER_TYPES[l.type]?.icon || '🏠'}</div>
        <div class="loc-body">
          <p class="loc-name">${escapeHtml(l.name)}</p>
          ${path ? `<div class="loc-path">In ${escapeHtml(path)}</div>` : ''}
        </div>
        <div class="loc-count">${count} items</div>
      </div>`;
    }).join('');
  });
  return html;
}

function renderStatsView(){
  const totalItems = state.itemsIndex.length;
  const totalQty = state.itemsIndex.reduce((sum, i)=> sum + (Number(i.qty) || 1), 0);
  const totalLocs = state.locations.length;
  
  return `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Item Types</div>
        <div class="num">${totalItems}</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Quantity</div>
        <div class="num">${totalQty}</div>
      </div>
      <div class="stat-card">
        <div class="label">Containers Count</div>
        <div class="num">${totalLocs}</div>
      </div>
      <div class="stat-card">
        <div class="label">Sync Status</div>
        <div class="num" style="font-size:14px; padding-top:6px;">🟢 Google Cloud</div>
      </div>
    </div>
    <div class="loc-group-title">Container Distribution</div>

      const count = state.itemsIndex.filter(i=>i.locationId===l.id).length;

function openContainerForm(existing){
  const currentType = existing ? existing.type : 'location';

  openOverlay(`
    <div class="sheet-header"><h2>${existing?'Edit Container':'New Container'}</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    <label>Name</label>
    <input type="text" id="conName" placeholder="e.g. Living Room, Shelf A, Box 1" value="${existing?escapeAttr(existing.name):''}">
    <label>Type (Hierarchy)</label>
    <select id="conType" onchange="updateParentOptionsForContainerType(this.value)">
      <option value="location" ${currentType==='location'?'selected':''}>🏠 Location (最大存放地)</option>
      <option value="shelf" ${currentType==='shelf'?'selected':''}>📚 Shelf (料架)</option>
      <option value="box" ${currentType==='box'?'selected':''}>📦 Box (箱子)</option>
      <option value="drawer" ${currentType==='drawer'?'selected':''}>🗄️ Drawer (抽屜)</option>
      <option value="cabinet" ${currentType==='cabinet'?'selected':''}>🚪 Cabinet (櫃子)</option>
    </select>
    <div id="parentContainerWrapper" style="${currentType==='location'?'display:none;':''}">
      <label>Parent Container (依存上層)</label>
      <select id="conParent"></select>
    </div>
    <label>Notes (Optional)</label>
    <textarea id="conNote" placeholder="Additional info...">${existing?escapeHtml(existing.note||''):''}</textarea>
    <button class="btn-primary" id="saveConBtn">${existing?'Save Changes':'Create'}</button>
    ${existing?'<button class="btn-danger" id="delConBtn">Delete Container</button>':''}
  `);

  window.updateParentOptionsForContainerType = (typeVal) => {
    const wrapper = document.getElementById('parentContainerWrapper');
    const parentSel = document.getElementById('conParent');
    
    if(typeVal === 'location'){
      wrapper.style.display = 'none';
      parentSel.innerHTML = '<option value="">None</option>';
    } else {
      wrapper.style.display = 'block';
      let validParents = [];
      if(typeVal === 'shelf'){
        validParents = state.locations.filter(l => (!existing || l.id !== existing.id) && l.type === 'location');
      } else {
        validParents = state.locations.filter(l => (!existing || l.id !== existing.id) && (l.type === 'location' || l.type === 'shelf'));
      }
      parentSel.innerHTML = '<option value="">Select parent...</option>' + validParents.map(l=>`<option value="${l.id}" ${existing&&existing.parentId===l.id?'selected':''}>${CONTAINER_TYPES[l.type].icon} ${escapeHtml(containerPath(l.id))}</option>`).join('');
    }
  };

  updateParentOptionsForContainerType(currentType);

  document.getElementById('saveConBtn').addEventListener('click', ()=> saveContainerFromForm(existing));
  if(existing) document.getElementById('delConBtn').addEventListener('click', ()=> deleteContainerFlow(existing.id));
}

async function saveContainerFromForm(existing){
  const name = document.getElementById('conName').value.trim();
  if(!name){ toast('Please enter a name'); return; }
  const type = document.getElementById('conType').value;
  const parentId = type === 'location' ? null : (document.getElementById('conParent').value || null);
  
  if(type !== 'location' && !parentId){
    toast('Dependency error: Shelf must be in a Location, and Storage units must be in a Location or Shelf.');
    return;
  }

  const note = document.getElementById('conNote').value.trim();
  if(existing){
    Object.assign(existing, {name, type, parentId, note});
  } else {
    state.locations.push({ id:uid('loc'), name, type, parentId, note, createdAt:Date.now() });
  }
  const ok = await saveLocations(state.locations);
  if(!ok){ toast('Save failed'); return; }
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('Container saved');
}

async function deleteContainerFlow(id){
  if(state.itemsIndex.some(i=>i.locationId===id) || state.locations.some(l=>l.parentId===id)){
    toast('Container is not empty, please clear items or child containers first'); return;
  }
  if(!confirm('Are you sure you want to delete this container?')) return;
  state.locations = state.locations.filter(l=>l.id!==id);
  await saveLocations(state.locations);
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('Container deleted');
}

    ${existingIndexEntry?'<button class="btn-danger" id="delItemBtn">Delete Item</button>':''}
  `);

  document.getElementById('photoInput').addEventListener('change', handlePhotoInput);
  document.getElementById('scanBarcodeBtn').addEventListener('click', startBarcodeScanner);
  document.getElementById('saveItemBtn').addEventListener('click', ()=> saveItemFromForm(existingIndexEntry));

  if(existingIndexEntry){
    document.getElementById('delItemBtn').addEventListener('click', ()=> deleteItemFlow(existingIndexEntry.id));
    getItem(existingIndexEntry.id).then(full=>{
      if(!full) return;
      document.getElementById('itName').value = full.name||'';
      document.getElementById('itQty').value = 1;
      document.getElementById('itCategory').value = full.category||'';
      document.getElementById('itLocation').value = full.locationId||'';
      document.getElementById('itTags').value = full.tags||'';
      document.getElementById('itNote').value = full.note||'';
      if(full.photos && full.photos.length > 0){
        state.photosDraft = [...full.photos];
        renderPhotoManager();
      } else if(full.photo){
        state.photosDraft = [{ full: full.photo, thumb: full.thumb||full.photo, hash: full.photoHash||0 }];
        renderPhotoManager();
      }
    });
  }
}

function renderPhotoManager(){
  const container = document.getElementById('photoManagerContainer');
  const addBtnHTML = `
    <label class="add-photo-btn" for="photoInput">
      <span style="font-size:18px;">＋</span>Add Photo
    </label>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">
  `;
  
  let thumbsHTML = state.photosDraft.map((p, idx)=>`
    <div class="photo-thumb-item">
      <img src="${p.thumb}">
      <button type="button" class="del-photo" onclick="removePhotoDraft(${idx})">✕</button>
    </div>
  `).join('');

  container.innerHTML = thumbsHTML + addBtnHTML;
  document.getElementById('photoInput').addEventListener('change', handlePhotoInput);
}

window.removePhotoDraft = (idx) => {
  state.photosDraft.splice(idx, 1);
  renderPhotoManager();
};

let html5QrCode = null;
function startBarcodeScanner(){
  const container = document.getElementById('scannerContainer');
  container.style.display = 'block';
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (decodedText) => {
      document.getElementById('itName').value = `Barcode: ${decodedText}`;
      stopBarcodeScanner();
      toast('Barcode scanned successfully!');
    },
    (errorMessage) => {}
  ).catch(err => {
    toast('Unable to access camera permission');
    container.style.display = 'none';
  });
  document.getElementById('closeScannerBtn').onclick = stopBarcodeScanner;
}

function stopBarcodeScanner(){
  if(html5QrCode){
    html5QrCode.stop().then(()=>{
      document.getElementById('scannerContainer').style.display = 'none';
    }).catch(err => {
      document.getElementById('scannerContainer').style.display = 'none';
    });
  } else {
    document.getElementById('scannerContainer').style.display = 'none';
  }
}

async function handlePhotoInput(e){
  const file = e.target.files[0];
  if(!file) return;
  const aiStatus = document.getElementById('aiNameStatus');
  const suggestionBox = document.getElementById('locationSuggestionBox');
  aiStatus.innerHTML = '<span class="loading-dot"></span>Processing photo & matching history...';

  try{
    const processed = await compressImage(file, 900, 0.72);

    let matchedItem = null;
    let fullMatchedRecord = null;
    for(const indexEntry of state.itemsIndex){
      const fullRec = await getItem(indexEntry.id);
      if(fullRec && fullRec.photoHash && Math.abs(fullRec.photoHash - processed.hash) < 15000){
        matchedItem = indexEntry;
        fullMatchedRecord = fullRec;
        break;
      }
    }

    if(matchedItem && fullMatchedRecord){
      state.matchedExistingItem = fullMatchedRecord;
      document.getElementById('itName').value = fullMatchedRecord.name;
      if(fullMatchedRecord.category) document.getElementById('itCategory').value = fullMatchedRecord.category;
      if(fullMatchedRecord.tags) document.getElementById('itTags').value = fullMatchedRecord.tags;
      if(fullMatchedRecord.note) document.getElementById('itNote').value = fullMatchedRecord.note;
      
      const suggestedPlacementName = containerPath(fullMatchedRecord.locationId) || 'Unassigned';
      document.getElementById('itLocation').value = fullMatchedRecord.locationId || '';

      suggestionBox.style.display = 'block';
      suggestionBox.innerHTML = `💡 <b>Smart Guidance:</b> Identical item detected. Recommended placement: <b>${escapeHtml(suggestedPlacementName)}</b> (Quantity will be accumulated). You can change placement below if needed.`;
      
      aiStatus.textContent = `🎯 Recognized identical item: ${fullMatchedRecord.name}`;
      toast('Identical item matched for quantity increment');
      return;
    }

    aiStatus.textContent = '🔍 Running OCR spec sheet analysis...';
    const worker = await Tesseract.createWorker('eng+chi_tra');
    const ret = await worker.recognize(processed.full);
    await worker.terminate();

    const recognizedText = ret.data.text.trim();
    if(recognizedText.length > 8){
      state.photosDraft.push(processed);
      renderPhotoManager();

      const noteField = document.getElementById('itNote');
      const currentNote = noteField.value;
      noteField.value = currentNote ? currentNote + '\n--- OCR Spec ---\n' + recognizedText : '--- OCR Spec ---\n' + recognizedText;
      aiStatus.textContent = `✨ Spec sheet detected! Photo saved and OCR text recorded.`;
      toast('Spec sheet photo saved & OCR extracted');
    } else {
      state.photosDraft.push(processed);
      renderPhotoManager();
      aiStatus.textContent = `✨ New item photo added successfully!`;
    }
  }catch(err){
    toast('Image processing or OCR failed');
    aiStatus.textContent = '';
  }
}

async function saveItemFromForm(existingIndexEntry){
  stopBarcodeScanner();
  const name = document.getElementById('itName').value.trim();
  if(!name){ toast('Please enter item name'); return; }
  const addQty = parseFloat(document.getElementById('itQty').value) || 1;
  const category = document.getElementById('itCategory').value.trim();
  const locationId = document.getElementById('itLocation').value;
  const tags = document.getElementById('itTags').value.trim();
  const note = document.getElementById('itNote').value.trim();
  const now = Date.now();

  let targetItem = existingIndexEntry ? await getItem(existingIndexEntry.id) : state.matchedExistingItem;

  if(targetItem){
    targetItem.qty = (parseFloat(targetItem.qty) || 1) + addQty;
    targetItem.category = category || targetItem.category;
    targetItem.locationId = locationId || targetItem.locationId;
    targetItem.tags = tags || targetItem.tags;
    targetItem.note = note || targetItem.note;
    targetItem.updatedAt = now;

    if(state.photosDraft.length > 0){
      if(!targetItem.photos) targetItem.photos = [];
      targetItem.photos = targetItem.photos.concat(state.photosDraft);
    }

    await saveItemRecord(targetItem);

    const indexEntry = { id: targetItem.id, name: targetItem.name, qty: targetItem.qty, category: targetItem.category, locationId: targetItem.locationId, tags: targetItem.tags, thumb: targetItem.thumb || (targetItem.photos[0] ? targetItem.photos[0].thumb : undefined), updatedAt: now };
    const idx = state.itemsIndex.findIndex(i=>i.id===targetItem.id);
    if(idx>=0) state.itemsIndex[idx]=indexEntry; else state.itemsIndex.push(indexEntry);
    await saveItemsIndex(state.itemsIndex);

    closeOverlay();
    renderSearchRow(); renderMain();
    toast(`Quantity accumulated! Total: ×${targetItem.qty}`);
    return;
  }

  let id = uid('item');
  let createdAt = now;
  const photos = state.photosDraft;
  const firstPhoto = photos.length > 0 ? photos[0] : null;
  const photo = firstPhoto ? firstPhoto.full : undefined;
  const thumb = firstPhoto ? firstPhoto.thumb : undefined;
  const photoHash = firstPhoto ? firstPhoto.hash : undefined;

  const fullRecord = { id, name, qty: addQty, category, locationId, tags, note, photos, photo, photoHash, createdAt, updatedAt: now };
  await saveItemRecord(fullRecord);

  const indexEntry = { id, name, qty: addQty, category, locationId, tags, thumb, updatedAt: now };
  state.itemsIndex.push(indexEntry);
  await saveItemsIndex(state.itemsIndex);

  closeOverlay();
  renderSearchRow(); renderMain();
  toast('Item created successfully');
}

async function deleteItemFlow(id){
  if(!confirm('Are you sure you want to delete this item?')) return;
  state.itemsIndex = state.itemsIndex.filter(i=>i.id!==id);
  await saveItemsIndex(state.itemsIndex);
  await deleteItemRecord(id);
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('Item deleted');
}

async function openItemDetailDesktop(id){
  const indexEntry = state.itemsIndex.find(i=>i.id===id);
  if(!indexEntry) return;
  const full = await getItem(id);
  if(!full) return;
  const t = containerTypeOf(full.locationId);
  const tinfo = CONTAINER_TYPES[t]||CONTAINER_TYPES.location;
  const photoList = (full.photos && full.photos.length > 0) 
    ? full.photos.map(p=>`<img class="detail-photo" src="${p.full}">`).join('')
    : (full.photo ? `<img class="detail-photo" src="${full.photo}">` : `<div class="detail-photo">${tinfo.icon}</div>`);

  const pane = document.getElementById('desktopDetailPane');
  pane.innerHTML = `
    <div class="sheet-header"><h2>Item Details</h2></div>
    <div class="detail-photo-slider">${photoList}</div>
    <p class="detail-title">${escapeHtml(full.name)}</p>
    <div class="detail-row"><span class="k">Quantity</span><span class="v">${full.qty ?? 1}</span></div>
    ${full.category?`<div class="detail-row"><span class="k">Category</span><span class="v">${escapeHtml(full.category)}</span></div>`:''}
    <div class="detail-row"><span class="k">Placement</span><span class="v"><span class="tag-badge ${tinfo.cls}">${escapeHtml(containerPath(full.locationId)||'Unassigned')}</span></span></div>
    <div class="detail-row"><span class="k">Updated</span><span class="v">${new Date(full.updatedAt).toLocaleString('zh-TW')}</span></div>
    ${full.tags ? `<div style="margin-top:10px;">${full.tags.split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    ${full.note ? `<div class="note-block">${escapeHtml(full.note)}</div>` : ''}
    <button class="btn-primary" id="editItemDesktopBtn" style="margin-top:14px;">Edit Item</button>
  `;
  document.getElementById('editItemDesktopBtn').addEventListener('click', ()=> openItemForm(indexEntry));
}

async function openItemDetail(id){
  const indexEntry = state.itemsIndex.find(i=>i.id===id);
  if(!indexEntry) return;
  openOverlay(`<div class="sheet-header"><h2>Item Details</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div><p class="hint"><span class="loading-dot"></span>Loading...</p>`);
  const full = await getItem(id);
  if(!full){ toast('Failed to load'); closeOverlay(); return; }
  const t = containerTypeOf(full.locationId);
  const tinfo = CONTAINER_TYPES[t]||CONTAINER_TYPES.location;

  const photoList = (full.photos && full.photos.length > 0) 
    ? full.photos.map(p=>`<img class="detail-photo" src="${p.full}">`).join('')
    : (full.photo ? `<img class="detail-photo" src="${full.photo}">` : `<div class="detail-photo">${tinfo.icon}</div>`);

  document.querySelector('#overlayRoot .sheet').innerHTML = `
    <div class="sheet-header"><h2>Item Details</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    <div class="detail-photo-slider">${photoList}</div>
    <p class="detail-title">${escapeHtml(full.name)}</p>
    <div class="detail-row"><span class="k">Quantity</span><span class="v">${full.qty ?? 1}</span></div>
    ${full.category?`<div class="detail-row"><span class="k">Category</span><span class="v">${escapeHtml(full.category)}</span></div>`:''}
    <div class="detail-row"><span class="k">Placement</span><span class="v"><span class="tag-badge ${tinfo.cls}">${escapeHtml(containerPath(full.locationId)||'Unassigned')}</span></span></div>
    <div class="detail-row"><span class="k">Updated</span><span class="v">${new Date(full.updatedAt).toLocaleString('zh-TW')}</span></div>
    ${full.tags ? `<div style="margin-top:10px;">${full.tags.split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    ${full.note ? `<div class="note-block">${escapeHtml(full.note)}</div>` : ''}
    <button class="btn-primary" id="editItemBtn">Edit Item</button>
  `;
  document.getElementById('editItemBtn').addEventListener('click', ()=> openItemForm(indexEntry));
}

document.querySelectorAll('nav.bottom button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    renderSearchRow();
    renderMain();
  });
});

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

init();
</script>
