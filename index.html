<script>
// Dynamically generate version string using current system time (including real seconds)
function getDynamicVersion(){
  const now = new Date();
  const yy = String(now.getFullYear()).slice(-2);
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const hh = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  return `r${yy}.${mm}.${dd}.${hh}${min}${ss}`;
}

const APP_VERSION = getDynamicVersion();
const VERSION_LOG = [
  { v: APP_VERSION, note:'Optimized Google OAuth prompt behavior to prevent repetitive consent popups after initial login.' },
  { v:'r26.0828.195035', note:'Enforced real-time seconds in dynamic versioning and updated container hierarchy logic.' },
  { v:'r26.0828.172412', note:'Removed random name suggestions, enabled precise history image matching for identical items' },
  { v:'r26.0827', note:'Initial release: Location management, item creation, search and filter' },
];

const STORE_KEYS = { LOCATIONS:'locations', ITEMS_INDEX:'items-index', ITEM_PREFIX:'item:' };
const GOOGLE_CLIENT_ID = '412152569230-fpq2tbie8v12ki3rb2nuhno0tq46cjl6.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_NAME = 'HomeStock 家庫資料';

let driveState = { accessToken:null, tokenClient:null, folderId:null };

document.getElementById('loginVersionTag').textContent = APP_VERSION;
document.getElementById('loginVersionTag').addEventListener('click', showVersionLog);

function waitForGoogle(){
  return new Promise(resolve=>{
    (function tryInit(){
      if(window.google && google.accounts && google.accounts.oauth2) resolve();
      else setTimeout(tryInit, 100);
    })();
  });
}

async function initTokenClient(){
  await waitForGoogle();
  driveState.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: ()=>{},
  });
}

function requestAccessToken(interactive){
  return new Promise((resolve, reject)=>{
    driveState.tokenClient.callback = (resp)=>{
      if(resp.error){ reject(resp); return; }
      driveState.accessToken = resp.access_token;
      resolve(resp.access_token);
    };
    // Use select_account or empty prompt for non-interactive background token refresh
    driveState.tokenClient.requestAccessToken({ prompt: interactive ? 'select_account' : '' });
  });
}

async function driveFetch(url, options={}, allowRetry=true){
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer '+driveState.accessToken });
  const res = await fetch(url, options);
  if(res.status===401 && allowRetry){
    await requestAccessToken(false);
    return driveFetch(url, options, false);
  }
  return res;
}

async function ensureFolder(){
  if(driveState.folderId) return driveState.folderId;
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  if(data.files && data.files.length>0){ driveState.folderId = data.files[0].id; return driveState.folderId; }
  const createRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder' }),
  });
  const created = await createRes.json();
  driveState.folderId = created.id;
  return driveState.folderId;
}

async function findFileId(name){
  const folderId = await ensureFolder();
  const q = encodeURIComponent(`name='${name}' and '${folderId}' in parents and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function safeGet(key){
  try{
    const fileId = await findFileId(key+'.json');
    if(!fileId) return null;
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

async function safeSet(key, value){
  try{
    const folderId = await ensureFolder();
    const name = key+'.json';
    const existingId = await findFileId(name);
    const content = JSON.stringify(value);
    if(existingId){
      const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`, {
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body: content,
      });
      return res.ok;
    } else {
      const boundary = 'homestock-'+Date.now();
      const metadata = { name, parents:[folderId] };
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n`+
        `--${boundary}--`;
      const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`, {
        method:'POST',
        headers:{'Content-Type': `multipart/related; boundary=${boundary}`},
        body,
      });
      return res.ok;
    }
  }catch(e){ return false; }
}

async function safeDelete(key){
  try{
    const fileId = await findFileId(key+'.json');
    if(!fileId) return;
    await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, { method:'DELETE' });
  }catch(e){}
}

async function getLocations(){ return (await safeGet(STORE_KEYS.LOCATIONS)) || []; }
async function saveLocations(list){ return safeSet(STORE_KEYS.LOCATIONS, list); }
async function getItemsIndex(){ return (await safeGet(STORE_KEYS.ITEMS_INDEX)) || []; }
async function saveItemsIndex(list){ return safeSet(STORE_KEYS.ITEMS_INDEX, list); }
async function getItem(id){ return safeGet(STORE_KEYS.ITEM_PREFIX+id); }
async function saveItemRecord(item){ return safeSet(STORE_KEYS.ITEM_PREFIX+item.id, item); }
async function deleteItemRecord(id){ return safeDelete(STORE_KEYS.ITEM_PREFIX+id); }

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

let state = {
  tab:'items',
  locations:[],
  itemsIndex:[],
  query:'',
  locationFilter:'',
  photoDraft:null,
};

const LOC_TYPES = {
  location:{label:'Location', icon:'📍', cls:'tag-other'},
  shelf:{label:'Shelf (料架)', icon:'📚', cls:'tag-shelf'},
  box:{label:'Box', icon:'📦', cls:'tag-box'},
};

function locationById(id){ return state.locations.find(l=>l.id===id); }
function locationPath(id){
  const parts=[]; let cur=locationById(id); let guard=0;
  while(cur && guard<8){ parts.unshift(cur.name); cur = cur.parentId? locationById(cur.parentId): null; guard++; }
  return parts.join(' › ');
}
function locationTypeOf(id){
  const l=locationById(id); return l? l.type : 'location';
}

function compressImage(file, maxSize, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; }
        else if(h>=w && h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        
        // Generate perceptual hash to match identical item images from history
        const data = ctx.getImageData(0, 0, 32, 32).data;
        let hash = 0;
        for (let i = 0; i < data.length; i += 4) {
          hash = ((hash << 5) - hash) + (data[i] + data[i+1] + data[i+2]);
          hash |= 0;
        }

        resolve({full: canvas.toDataURL('image/jpeg', quality), thumb: canvas.toDataURL('image/jpeg', 0.6), hash: Math.abs(hash)});
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function toast(msg){
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('overlayRoot').appendChild(el);
  setTimeout(()=>el.remove(),1800);
}

async function init(){
  await initTokenClient();
  document.getElementById('authSigninBtn').addEventListener('click', doSignIn);
  document.getElementById('cloudBtn').addEventListener('click', openAccountSheet);
}

async function doSignIn(){
  const statusEl = document.getElementById('authStatus');
  statusEl.innerHTML = '<span class="loading-dot"></span>Connecting...';
  try{
    await requestAccessToken(true);
    statusEl.textContent = 'Preparing directory...';
    await ensureFolder();
    await afterSignIn();
  }catch(e){
    statusEl.textContent = 'Sign-in failed or cancelled, please try again';
  }
}

async function afterSignIn(){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const vTag = document.getElementById('versionTag');
  vTag.textContent = APP_VERSION;
  vTag.addEventListener('click', showVersionLog);
  renderMain();
  state.locations = await getLocations();
  state.itemsIndex = await getItemsIndex();
  renderSearchRow();
  renderMain();
}

function openAccountSheet(){
  openOverlay(`
    <div class="sheet-header"><h2>☁️ Cloud & Backup</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    <p class="hint">Data is synced to Google Drive folder "${DRIVE_FOLDER_NAME}".</p>

  `);

  document.getElementById('exportCsvBtn').addEventListener('click', exportCsvData);

async function exportJsonData(){
  const allData = { locations: state.locations, items: state.itemsIndex, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(allData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `homestock-backup-${Date.now()}.json`;
  a.click();
  toast('JSON backup exported');
}

async function exportCsvData(){
  let csv = '\uFEFFName,Quantity,Category,Location/Box/Shelf,Tags,Updated\n';
  state.itemsIndex.forEach(i=>{
    const locName = locationPath(i.locationId) || 'Unassigned';
    csv += `"${i.name || ''}",${i.qty || 1},"${i.category || ''}","${locName}","${i.tags || ''}","${new Date(i.updatedAt).toLocaleString()}"\n`;
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `homestock-inventory-${Date.now()}.csv`;
  a.click();
  toast('CSV spreadsheet exported');
}

function doSignOut(){
  if(driveState.accessToken){
    try{ google.accounts.oauth2.revoke(driveState.accessToken, ()=>{}); }catch(e){}
  }
  driveState.accessToken = null; driveState.folderId = null;
  state.locations = []; state.itemsIndex = [];
  closeOverlay();
  document.getElementById('app').style.display = 'none';

function renderSearchRow(){

  row.innerHTML = `
    <div class="search-box">
      <span>🔍</span>

function renderMain(){
  const main = document.getElementById('main');
  document.getElementById('headerCount').textContent = state.tab==='items'
    ? `${state.itemsIndex.length} items`
    : state.tab==='locations' ? `${state.locations.length} containers` : 'Overview';

  if(state.tab==='items'){ main.innerHTML = renderItemsList(); bindItemCardClicks(); }
  else if(state.tab==='locations'){ main.innerHTML = renderLocationsList(); bindLocationCardClicks(); }
  else { main.innerHTML = renderStatsView(); }
}

function renderItemsList(){
  let list = state.itemsIndex;
  if(state.locationFilter) list = list.filter(i=>i.locationId===state.locationFilter);
  if(state.query.trim()){
    const q=state.query.trim().toLowerCase();
    list = list.filter(i => (i.name||'').toLowerCase().includes(q) || (i.tags||'').toLowerCase().includes(q) || (i.category||'').toLowerCase().includes(q));
  }
  if(list.length===0){
    return `<div class="empty-state"><div class="glyph">📦</div>
      <p>${state.itemsIndex.length===0 ? 'No items found' : 'No matching items'}</p>
      <p>${state.itemsIndex.length===0 ? 'Tap "+" below to create your first inventory item' : 'Try different keywords or filters'}</p>
    </div>`;
  }
  list = [...list].sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
  return list.map(it=>{
    const t = locationTypeOf(it.locationId);
    const tinfo = LOC_TYPES[t] || LOC_TYPES.location;
    const thumb = it.thumb
      ? `<img class="item-thumb" src="${it.thumb}">`
      : `<div class="item-thumb">${tinfo.icon}</div>`;
    return `
    <div class="item-card" data-id="${it.id}">
      ${thumb}
      <div class="item-info">
        <p class="name">${escapeHtml(it.name)}</p>
        <div class="item-meta">
          <span class="qty-badge">×${it.qty ?? 1}</span>
          ${it.locationId ? `<span class="tag-badge ${tinfo.cls}">${escapeHtml(locationPath(it.locationId)||'Unclassified')}</span>` : `<span class="tag-badge tag-other">No Container</span>`}
        </div>
        ${it.tags ? `<div class="tags-line">${escapeHtml(it.tags)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderLocationsList(){
  if(state.locations.length===0){
    return `<div class="empty-state"><div class="glyph">🏷️</div>
      <p>No locations, boxes, or shelves created yet</p>
      <p>Create a Location, Box, or Shelf first</p>
    </div>`;
  }
  const groups = {location:[],shelf:[],box:[]};
  state.locations.forEach(l=> (groups[l.type]||groups.location).push(l));
  let html='';
  Object.keys(LOC_TYPES).forEach(typeKey=>{
    const arr = groups[typeKey];
    if(!arr || arr.length===0) return;
    html += `<div class="loc-group-title">${LOC_TYPES[typeKey].icon} ${LOC_TYPES[typeKey].label} · ${arr.length}</div>`;
    html += arr.map(l=>{
      const count = state.itemsIndex.filter(i=>i.locationId===l.id).length;
      const path = l.parentId ? locationPath(l.parentId) : '';
      return `
      <div class="loc-card" data-id="${l.id}">
        <div class="loc-icon">${LOC_TYPES[l.type]?.icon || '📍'}</div>
        <div class="loc-body">
          <p class="loc-name">${escapeHtml(l.name)}</p>
          ${path ? `<div class="loc-path">Contained in ${escapeHtml(path)}</div>` : ''}
        </div>
        <div class="loc-count">${count} items</div>
      </div>`;
    }).join('');
  });
  return html;
}

function renderStatsView(){
  const totalItems = state.itemsIndex.length;
  const totalQty = state.itemsIndex.reduce((sum, i)=> sum + (Number(i.qty) || 1), 0);
  const totalLocs = state.locations.length;
  
  return `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Item Types</div>
        <div class="num">${totalItems}</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Quantity</div>
        <div class="num">${totalQty}</div>
      </div>
      <div class="stat-card">
        <div class="label">Containers Count</div>
        <div class="num">${totalLocs}</div>
      </div>
      <div class="stat-card">
        <div class="label">Sync Status</div>
        <div class="num" style="font-size:14px; padding-top:6px;">🟢 Google Cloud</div>
      </div>

function openLocationForm(existing){
  const currentType = existing ? existing.type : 'location';
  const parentOptions = state.locations
    .filter(l=> !existing || l.id!==existing.id)
    .filter(l=>{
      if(currentType === 'shelf') return l.type === 'location';
      if(currentType === 'box') return l.type === 'location' || l.type === 'shelf';
      if(currentType === 'location') return false;
      return true;
    })
    .map(l=>`<option value="${l.id}" ${existing&&existing.parentId===l.id?'selected':''}>${escapeHtml(locationPath(l.id))}</option>`).join('');

  openOverlay(`
    <div class="sheet-header"><h2>${existing?'Edit Container':'New Location / Box / Shelf'}</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    <label>Name</label>
    <input type="text" id="locName" placeholder="e.g. Living Room, Shelf A, Box 1" value="${existing?escapeAttr(existing.name):''}">
    <label>Type</label>
    <select id="locType" onchange="updateParentOptionsForType(this.value)">
      <option value="location" ${currentType==='location'?'selected':''}>📍 Location (儲位)</option>
      <option value="shelf" ${currentType==='shelf'?'selected':''}>📚 Shelf (料架)</option>
      <option value="box" ${currentType==='box'?'selected':''}>📦 Box (箱)</option>
    </select>
    <div id="parentContainerWrapper" style="${currentType==='location'?'display:none;':''}">
      <label>Parent Container</label>
      <select id="locParent">
        <option value="">None</option>
        ${parentOptions}
      </select>
    </div>
    <label>Notes (Optional)</label>
    <textarea id="locNote" placeholder="Additional info...">${existing?escapeHtml(existing.note||''):''}</textarea>
    <button class="btn-primary" id="saveLocBtn">${existing?'Save Changes':'Create'}</button>
    ${existing?'<button class="btn-danger" id="delLocBtn">Delete Container</button>':''}
  `);

  window.updateParentOptionsForType = (typeVal) => {
    const wrapper = document.getElementById('parentContainerWrapper');
    const parentSel = document.getElementById('locParent');
    if(typeVal === 'location'){
      wrapper.style.display = 'none';
      parentSel.innerHTML = '<option value="">None</option>';
    } else {
      wrapper.style.display = 'block';
      const validParents = state.locations
        .filter(l=> !existing || l.id!==existing.id)
        .filter(l=>{
          if(typeVal === 'shelf') return l.type === 'location';
          if(typeVal === 'box') return l.type === 'location' || l.type === 'shelf';
          return false;
        });
      parentSel.innerHTML = '<option value="">None</option>' + validParents.map(l=>`<option value="${l.id}" ${existing&&existing.parentId===l.id?'selected':''}>${escapeHtml(locationPath(l.id))}</option>`).join('');
    }
  };

  document.getElementById('saveLocBtn').addEventListener('click', ()=> saveLocationFromForm(existing));
  if(existing) document.getElementById('delLocBtn').addEventListener('click', ()=> deleteLocationFlow(existing.id));
}

async function saveLocationFromForm(existing){
  const name = document.getElementById('locName').value.trim();
  if(!name){ toast('Please enter a name'); return; }
  const type = document.getElementById('locType').value;
  const parentId = type === 'location' ? null : (document.getElementById('locParent').value || null);
  const note = document.getElementById('locNote').value.trim();
  if(existing){
    Object.assign(existing, {name,type,parentId,note});
  } else {
    state.locations.push({ id:uid('loc'), name, type, parentId, note, createdAt:Date.now() });
  }
  const ok = await saveLocations(state.locations);
  if(!ok){ toast('Save failed'); return; }
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('Container saved');
}

async function deleteLocationFlow(id){
  if(state.itemsIndex.some(i=>i.locationId===id) || state.locations.some(l=>l.parentId===id)){
    toast('Container is not empty, please clear items or child containers first'); return;
  }
  if(!confirm('Are you sure you want to delete this container?')) return;
  state.locations = state.locations.filter(l=>l.id!==id);
  await saveLocations(state.locations);
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('Container deleted');
}

let html5QrCode = null;
function startBarcodeScanner(){
  const container = document.getElementById('scannerContainer');
  container.style.display = 'block';
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (decodedText) => {
      document.getElementById('itName').value = `Barcode: ${decodedText}`;
      stopBarcodeScanner();
      toast('Barcode scanned successfully!');
    },
    (errorMessage) => {}
  ).catch(err => {
    toast('Unable to access camera permission');
    container.style.display = 'none';
  });
  document.getElementById('closeScannerBtn').onclick = stopBarcodeScanner;
}

function stopBarcodeScanner(){
  if(html5QrCode){
    html5QrCode.stop().then(()=>{
      document.getElementById('scannerContainer').style.display = 'none';
    }).catch(err => {
      document.getElementById('scannerContainer').style.display = 'none';
    });
  } else {
    document.getElementById('scannerContainer').style.display = 'none';
  }
}

async function handlePhotoInput(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById('photoPreview');
  const aiStatus = document.getElementById('aiNameStatus');
  preview.innerHTML = `<span class="loading-dot"></span>`;
  aiStatus.textContent = '🔄 Matching photo with history database...';

  try{
    const processed = await compressImage(file, 900, 0.72);
    state.photoDraft = processed;
    preview.innerHTML = `<img src="${processed.thumb}" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">`;

    // Check if an identical item exists in the system database via image hash matching
    let matchedItem = null;
    for(const indexEntry of state.itemsIndex){
      const fullRec = await getItem(indexEntry.id);
      if(fullRec && fullRec.photoHash && Math.abs(fullRec.photoHash - processed.hash) < 15000){
        matchedItem = fullRec;
        break;
      }
    }

    if(matchedItem){
      document.getElementById('itName').value = matchedItem.name;
      if(matchedItem.category) document.getElementById('itCategory').value = matchedItem.category;
      if(matchedItem.locationId) document.getElementById('itLocation').value = matchedItem.locationId;
      if(matchedItem.tags) document.getElementById('itTags').value = matchedItem.tags;
      if(matchedItem.note) document.getElementById('itNote').value = matchedItem.note;
      aiStatus.textContent = `🎯 Identical item detected! Auto-applied: ${matchedItem.name}`;
      toast('Applied existing name from matching history photo');
    } else {
      aiStatus.textContent = `✨ New item photo loaded. Enter name manually for future matching!`;
    }
  }catch(err){
    toast('Image processing failed');
    preview.innerHTML = '🖼️';
    aiStatus.textContent = '';
  }
}

async function saveItemFromForm(existingIndexEntry){
  stopBarcodeScanner();
  const name = document.getElementById('itName').value.trim();
  if(!name){ toast('Please enter item name'); return; }
  const qty = parseFloat(document.getElementById('itQty').value) || 0;
  const category = document.getElementById('itCategory').value.trim();
  const locationId = document.getElementById('itLocation').value;
  const tags = document.getElementById('itTags').value.trim();
  const note = document.getElementById('itNote').value.trim();
  const now = Date.now();

  let id, createdAt, photo, thumb, photoHash;
  if(existingIndexEntry){
    id = existingIndexEntry.id;
    const prevFull = await getItem(id) || {};
    createdAt = prevFull.createdAt || now;
    photo = prevFull.photo; thumb = existingIndexEntry.thumb; photoHash = prevFull.photoHash;
  } else {
    id = uid('item'); createdAt = now;
  }
  if(state.photoDraft === 'REMOVE'){ photo=undefined; thumb=undefined; photoHash=undefined; }
  else if(state.photoDraft && state.photoDraft.full){ 
    photo=state.photoDraft.full; 
    thumb=state.photoDraft.thumb; 
    photoHash=state.photoDraft.hash; 
  }

  const fullRecord = { id, name, qty, category, locationId, tags, note, photo, photoHash, createdAt, updatedAt: now };
  await saveItemRecord(fullRecord);

  const indexEntry = { id, name, qty, category, locationId, tags, thumb, updatedAt: now };
  const idx = state.itemsIndex.findIndex(i=>i.id===id);
  if(idx>=0) state.itemsIndex[idx]=indexEntry; else state.itemsIndex.push(indexEntry);
  await saveItemsIndex(state.itemsIndex);

  closeOverlay();
  renderSearchRow(); renderMain();
  toast(existingIndexEntry ? 'Item updated' : 'Item created');
}

async function deleteItemFlow(id){
  if(!confirm('Are you sure you want to delete this item?')) return;
  state.itemsIndex = state.itemsIndex.filter(i=>i.id!==id);
  await saveItemsIndex(state.itemsIndex);
  await deleteItemRecord(id);
  closeOverlay();
  renderSearchRow(); renderMain();
  toast('Item deleted');
}

async function openItemDetail(id){
  const indexEntry = state.itemsIndex.find(i=>i.id===id);
  if(!indexEntry) return;
  openOverlay(`<div class="sheet-header"><h2>Item Details</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div><p class="hint"><span class="loading-dot"></span>Loading...</p>`);
  const full = await getItem(id);
  if(!full){ toast('Failed to load'); closeOverlay(); return; }
  const t = locationTypeOf(full.locationId);
  const tinfo = LOC_TYPES[t]||LOC_TYPES.location;
  document.querySelector('#overlayRoot .sheet').innerHTML = `
    <div class="sheet-header"><h2>Item Details</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    ${full.photo ? `<img class="detail-photo" src="${full.photo}">` : `<div class="detail-photo">${tinfo.icon}</div>`}
    <p class="detail-title">${escapeHtml(full.name)}</p>
    <div class="detail-row"><span class="k">Quantity</span><span class="v">${full.qty ?? 1}</span></div>
    ${full.category?`<div class="detail-row"><span class="k">Category</span><span class="v">${escapeHtml(full.category)}</span></div>`:''}
    <div class="detail-row"><span class="k">Stored In</span><span class="v"><span class="tag-badge ${tinfo.cls}">${escapeHtml(locationPath(full.locationId)||'Unassigned')}</span></span></div>
    <div class="detail-row"><span class="k">Updated</span><span class="v">${new Date(full.updatedAt).toLocaleString('zh-TW')}</span></div>
    ${full.tags ? `<div style="margin-top:10px;">${full.tags.split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    ${full.note ? `<div class="note-block">${escapeHtml(full.note)}</div>` : ''}
    <button class="btn-primary" id="editItemBtn">Edit Item</button>
  `;
  document.getElementById('editItemBtn').addEventListener('click', ()=> openItemForm(indexEntry));
}

document.querySelectorAll('nav.bottom button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    renderSearchRow();
    renderMain();
  });
});

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

init();
</script>
</body>
</html>
